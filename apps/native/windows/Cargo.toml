[package]
name = "captures-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# The Windows host: Win32, DirectComposition, Direct2D, DirectWrite and UI
# Automation. Isolated like the GTK4 host: it must not change the shipping
# workspace's toolchain, lockfile, dependencies or packaging.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
captures-app = { path = "../../../crates/captures-app" }
captures-capture = { path = "../../../crates/captures-capture" }
captures-history = { path = "../../../crates/captures-history" }
captures-media = { path = "../../../crates/captures-media" }
# The resident tray: the native Win32 menus shipping's Tauri tray uses.
tray-icon = { version = "0.25.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
captures-settings = { path = "../../../crates/captures-settings" }
captures-recording = { path = "../../../crates/captures-recording" }
# Microphone enumeration (cpal/WASAPI) from the shared recording stack.
captures-recording-platform = { path = "../../../crates/captures-recording-platform" }
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
