[package]
name = "captures-gtk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# The Linux GTK4 host. Isolated like the wgpu workbench: it must not change
# the shipping workspace's toolchain, lockfile, dependencies or packaging.
[workspace]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
captures-app = { path = "../../../crates/captures-app" }
captures-capture = { path = "../../../crates/captures-capture" }
captures-media = { path = "../../../crates/captures-media" }
captures-history = { path = "../../../crates/captures-history" }
captures-settings = { path = "../../../crates/captures-settings" }
