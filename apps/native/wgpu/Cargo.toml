[package]
name = "captures-wgpu-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# An isolated renderer experiment: do not change the shipping workspace's
# toolchain, lockfile, dependencies, packaging, or supported platforms.
[workspace]

[dependencies]
eframe = { git = "https://github.com/emilk/egui", rev = "60d7caaea38a795618e842925061ad2210028a2a", default-features = false, features = ["wgpu", "x11", "wayland", "accesskit", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
captures-settings = { path = "../../../crates/captures-settings" }
captures-app = { path = "../../../crates/captures-app" }
captures-capture = { path = "../../../crates/captures-capture" }
captures-feedback = { path = "../../../crates/captures-feedback" }
captures-history = { path = "../../../crates/captures-history" }
captures-media = { path = "../../../crates/captures-media" }
captures-recording = { path = "../../../crates/captures-recording" }
captures-recording-platform = { path = "../../../crates/captures-recording-platform" }
arboard = "3.6"
rfd = "0.15"
tempfile = "3"
winit = { version = "=0.30.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
x11rb = "0.13"
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "windows")'.dependencies]
captures-session = { path = "../../../crates/captures-session" }
tray-icon = { version = "0.25.1", default-features = false }

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
