[package]
name = "captures-dcomp-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_System_Com",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
] }
windows-numerics = "0.3"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = "debuginfo"

[lints.clippy]
all = "deny"
