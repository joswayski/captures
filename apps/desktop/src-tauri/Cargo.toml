[package]
name = "captures-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "captures_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "captures"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
captures-capture = { path = "../../../crates/captures-capture" }
captures-media = { path = "../../../crates/captures-media" }
captures-recording = { path = "../../../crates/captures-recording" }
anyhow = "1"
chrono.workspace = true
image.workspace = true
parking_lot.workspace = true
png = "0.17"
quantette = { version = "0.6", default-features = false, features = ["image", "std", "threads"] }
# Lossy WebP via libwebp (image crate only supports lossless WebP encode).
webp = { version = "0.3", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
directories = "6"
mouse_position = "0.1.4"
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tauri-plugin-updater = "2.10.1"
trash = "5"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
captures-macos-window = { path = "../../../crates/captures-macos-window" }
captures-recording-macos = { path = "../../../crates/captures-recording-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
captures-recording-xcap = { path = "../../../crates/captures-recording-xcap" }
clipboard-win = { version = "5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
captures-recording-xcap = { path = "../../../crates/captures-recording-xcap" }

[lints]
workspace = true
