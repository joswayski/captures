[package]
name = "captures-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "captures_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "captures"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
captures-capture = { path = "../../../crates/captures-capture" }
anyhow = "1"
chrono.workspace = true
image.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
directories = "6"
mouse_position = "0.1.4"
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tauri-plugin-updater = "2.10.1"
trash = "5"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
captures-macos-window = { path = "../../../crates/captures-macos-window" }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[lints]
workspace = true
