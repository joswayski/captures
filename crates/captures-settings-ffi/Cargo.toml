[package]
name = "captures-settings-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
captures-app = { path = "../captures-app" }
captures-capture = { path = "../captures-capture" }
captures-feedback = { path = "../captures-feedback" }
captures-history = { path = "../captures-history" }
captures-media = { path = "../captures-media" }
captures-recording = { path = "../captures-recording" }
captures-recording-platform = { path = "../captures-recording-platform" }
captures-settings = { path = "../captures-settings" }
chrono.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
unsafe_code = "allow"
