<!doctype html>
<meta charset="utf-8">
<title>Canvas shadow references</title>
<pre id="out"></pre>
<script>
  const cases = [];

  function make(name, width, height, paint) {
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext("2d", { alpha: true, colorSpace: "srgb" });
    paint(context);
    cases.push({ name, width, height, url: canvas.toDataURL("image/png") });
  }

  function shadowRectangle(context, options) {
    context.save();
    context.globalAlpha = options.opacity;
    context.globalCompositeOperation = options.blend;
    if (options.rotate) {
      context.translate(options.centerX, options.centerY);
      context.rotate(options.rotate);
      context.translate(-options.centerX, -options.centerY);
    }
    context.shadowColor = options.shadowColor;
    context.shadowBlur = options.blur;
    context.shadowOffsetX = options.offsetX;
    context.shadowOffsetY = options.offsetY;
    context.fillStyle = options.fill;
    context.strokeStyle = options.stroke;
    context.lineWidth = options.lineWidth;
    context.lineCap = "round";
    context.lineJoin = "round";
    context.beginPath();
    context.roundRect(options.x, options.y, options.width, options.height, options.radius);
    context.fill();
    context.stroke();
    context.shadowColor = "rgba(0,0,0,0)";
    context.fill();
    context.stroke();
    context.restore();
  }

  make("zero-blur-fill-stroke", 96, 72, (context) => {
    shadowRectangle(context, {
      x: 22, y: 18, width: 42, height: 27, radius: 5,
      fill: "rgba(235,53,91,0.63)", stroke: "rgba(24,99,220,0.78)", lineWidth: 7,
      opacity: 0.71, blend: "source-over",
      shadowColor: "rgba(30,190,88,0.57)", blur: 0, offsetX: 9, offsetY: -5,
    });
  });

  make("rotated-blurred-multiply", 112, 88, (context) => {
    context.fillStyle = "rgb(207,181,144)";
    context.fillRect(0, 0, 112, 88);
    context.fillStyle = "rgba(73,126,211,0.62)";
    context.fillRect(17, 13, 78, 56);
    shadowRectangle(context, {
      x: 31, y: 24, width: 47, height: 31, radius: 5,
      fill: "rgba(246,108,42,0.72)", stroke: "rgba(31,42,77,0.88)", lineWidth: 6,
      opacity: 0.64, blend: "multiply",
      shadowColor: "rgba(145,35,214,0.68)", blur: 14, offsetX: -9, offsetY: 6,
      centerX: 54.5, centerY: 39.5, rotate: 23 * Math.PI / 180,
    });
  });

  make("edge-offcanvas", 84, 64, (context) => {
    shadowRectangle(context, {
      x: -31, y: 17, width: 27, height: 28, radius: 4,
      fill: "rgba(238,183,31,0.81)", stroke: "rgba(15,30,60,0.9)", lineWidth: 5,
      opacity: 0.8, blend: "source-over",
      shadowColor: "rgba(23,117,232,0.74)", blur: 8, offsetX: 34, offsetY: -4,
    });
  });

  make("screen-partial-alpha", 92, 70, (context) => {
    context.fillStyle = "rgb(38,54,81)";
    context.fillRect(0, 0, 92, 70);
    shadowRectangle(context, {
      x: 20, y: 17, width: 45, height: 30, radius: 5,
      fill: "rgba(215,38,83,0.52)", stroke: "rgba(242,202,68,0.67)", lineWidth: 8,
      opacity: 0.55, blend: "screen",
      shadowColor: "rgba(42,203,176,0.61)", blur: 10, offsetX: 7, offsetY: 9,
    });
  });

  out.textContent = JSON.stringify(cases);
</script>
