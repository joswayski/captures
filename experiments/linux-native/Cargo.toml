[package]
name = "captures-linux-native"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately outside the shipping workspace and release pipeline.
[workspace]

[features]
default = ["native"]
native = ["dep:gtk", "dep:global-hotkey", "dep:ksni", "dep:png", "dep:quantette", "dep:jpeg-encoder", "dep:webp"]

[dependencies]
captures-capture = { path = "../../crates/captures-capture" }
captures-recording = { path = "../../crates/captures-recording" }
captures-recording-xcap = { path = "../../crates/captures-recording-xcap" }
captures-media = { path = "../../crates/captures-media" }
captures-session = { path = "../../crates/captures-session" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_8"], optional = true }
global-hotkey = { version = "=0.8.0", optional = true }
ksni = { version = "0.3", features = ["blocking"], optional = true }
png = { version = "0.17", optional = true }
quantette = { version = "0.6", default-features = false, features = ["image", "std", "threads"], optional = true }
jpeg-encoder = { version = "0.6", optional = true }
webp = { version = "0.3", default-features = false, optional = true }
gdk4-x11 = "0.10"
x11rb = { version = "0.13", features = ["shape"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "captures-linux-native"
path = "src/native.rs"
required-features = ["native"]

[profile.release]
strip = true

[profile.dev]
debug = 0
