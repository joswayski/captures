[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[package]
name = "captures_macos_bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
captures-capture = { path = "../../../crates/captures-capture" }
captures-media = { path = "../../../crates/captures-media" }
captures-recording = { path = "../../../crates/captures-recording" }
captures-recording-macos = { path = "../../../crates/captures-recording-macos" }
captures-session = { path = "../../../crates/captures-session" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-encoder = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
webp = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
