[package]
name = "captures-windows-native"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone experiment: intentionally excluded from the shipping workspace.
[workspace]

[dependencies]
captures-capture = { path = "../../crates/captures-capture" }
captures-image = { path = "../../crates/captures-image" }
captures-media = { path = "../../crates/captures-media" }
captures-recording = { path = "../../crates/captures-recording" }
captures-recording-xcap = { path = "../../crates/captures-recording-xcap" }
captures-session = { path = "../../crates/captures-session" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jpeg-encoder = "0.6"
png = "0.17"
quantette = { version = "0.6", default-features = false, features = ["image", "std", "threads"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
webp = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.2"

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "captures-windows-native"
path = "src/main.rs"

[[bench]]
name = "state"
harness = false
