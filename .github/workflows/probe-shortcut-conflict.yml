name: Probe shortcut conflict
on:
  push:
    branches: [probe/shortcut-conflict]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && probe/mac.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shot, path: /tmp/after.png }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe/windows.py
