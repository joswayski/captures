name: Native macOS workbench

# Runs on main only; pull requests get no CI. Use "Run workflow" to test a branch.
on:
  push:
    branches: [main]
    paths:
      - 'apps/native/**'
      - 'crates/captures-settings*/**'
      - 'crates/captures-app/**'
      - 'crates/captures-feedback/**'
      - 'crates/captures-history/**'
      - 'crates/captures-image/**'
      - 'crates/captures-capture/**'
      - 'crates/captures-session/**'
      - 'crates/captures-recording*/**'
      - 'crates/captures-media/**'
      - 'Cargo.lock'
      - 'shared/**'
      - 'apps/desktop/ui/src/lib/thumbnailExit.ts'
      - 'apps/desktop/assets/icon.svg'
      - '.github/workflows/native-macos.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# The running build always finishes and only the newest waiting push runs next
# (GitHub replaces older pending runs in the group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    uses: ./.github/workflows/mac-route.yml
    secrets: inherit

  build-and-test:
    needs: route
    # Recording's apple-metal bridge needs the macOS 26 SDK, like the desktop CI.
    runs-on: ${{ needs.route.outputs.mac == 'true' && fromJSON('["self-hosted","josemac"]') || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - name: Provision FFmpeg verification tools
        run: |
          brew install ffmpeg
          FFMPEG="$(command -v ffmpeg)"
          FFPROBE="$(command -v ffprobe)"
          test -x "$FFMPEG"
          test -x "$FFPROBE"
          "$FFMPEG" -version
          "$FFPROBE" -version
          printf 'CAPTURES_FFMPEG=%s\nCAPTURES_FFPROBE=%s\n' "$FFMPEG" "$FFPROBE" >> "$GITHUB_ENV"
      - run: bash apps/native/macos/build.sh
        env:
          CAPTURES_TEST_ARTIFACTS: ${{ runner.temp }}/native-pixels
      - name: Forward native media between AppKit processes
        run: python3 apps/native/instance_smoke.py --binary apps/native/macos/.build/release/CapturesNative --output "$RUNNER_TEMP/native-preferences/instance"
      - name: Open media through a disposable native app bundle
        run: |
          python3 apps/native/macos_open_with_smoke.py \
            --binary apps/native/macos/.build/release/CapturesNative \
            --resources apps/native/macos/.build/release/CapturesNative_CapturesNative.bundle \
            --output "$RUNNER_TEMP/native-preferences/open-with"
      - name: Render native preferences
        run: |
          mkdir -p "$RUNNER_TEMP/native-preferences"
          for appearance in light dark; do
            apps/native/macos/.build/release/CapturesNative --scene preferences \
              --appearance "$appearance" --settings-file "$RUNNER_TEMP/native-preferences/$appearance.json" \
              --screenshot "$RUNNER_TEMP/native-preferences/$appearance.png" --quit-after 4
            test -s "$RUNNER_TEMP/native-preferences/$appearance.png"
          done
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "apps/native")
          from history_fixture import write_completed_settings
          write_completed_settings(Path(os.environ["RUNNER_TEMP"]) / "native-preferences/live-settings.json")
          PY
          apps/native/macos/.build/release/CapturesNative --live \
            --settings-file "$RUNNER_TEMP/native-preferences/live-settings.json" \
            --history-root "$RUNNER_TEMP/native-live-history" --appearance light \
            --screenshot "$RUNNER_TEMP/native-preferences/live-empty.png" --quit-after 4
          test -s "$RUNNER_TEMP/native-preferences/live-empty.png"
          python3 apps/native/history_fixture.py "$RUNNER_TEMP/native-populated-history"
          apps/native/macos/.build/release/CapturesNative --live \
            --settings-file "$RUNNER_TEMP/native-preferences/live-settings.json" \
            --history-root "$RUNNER_TEMP/native-populated-history" --appearance dark \
            --screenshot "$RUNNER_TEMP/native-preferences/live-populated.png" --quit-after 4
          test -s "$RUNNER_TEMP/native-preferences/live-populated.png"
      - name: Region selector diagnostics (not hardware acceptance)
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          sys.path.insert(0, "apps/native")
          from profile import trial
          binary = Path("apps/native/macos/.build/release/CapturesNative").resolve()
          output = Path(os.environ["RUNNER_TEMP"]) / "native-region-profile"
          output.mkdir()
          (output / "metadata.json").write_text(json.dumps({"platform": platform.platform(),
              "binarySHA256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "note": "One excluded warmup and one 30s trial; process CPU/RSS only, not footprint, GPU, WindowServer, input latency or acceptance."}, indent=2))
          for iteration in range(2):
              for active in ([False, True] if iteration == 0 else [True, False]):
                  result = trial(binary, output / f"{iteration}-region-{'active' if active else 'static'}",
                                 "region", active, False, 30)
                  print(iteration, active, result["summary"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-region-profile-macos
          path: ${{ runner.temp }}/native-region-profile
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-preferences-macos
          path: ${{ runner.temp }}/native-preferences
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pixels
          path: ${{ runner.temp }}/native-pixels
          if-no-files-found: ignore
      - run: python3 -m unittest discover -s apps/native -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-build
          path: |
            apps/native/macos/.build/release/CapturesNative
            apps/native/macos/.build/release/CapturesNative_CapturesNative.bundle
          include-hidden-files: true
          if-no-files-found: error
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  development-package:
    needs: [route, build-and-test]
    runs-on: ${{ needs.route.outputs.mac == 'true' && fromJSON('["self-hosted","josemac"]') || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-build
          path: native-build
      - uses: ./.github/actions/prepare-media
      - name: Stage the isolated native test app with pinned media tools
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          python apps/native/package.py --platform macos \
            --binary native-build/CapturesNative \
            --resources native-build/CapturesNative_CapturesNative.bundle \
            --media-target "$target" --adhoc-sign --output native-package \
            --archive "native-development-$target.zip"
          ditto -x -k "native-development-$target.zip" native-unpacked
          app="native-unpacked/native-package/Captures Native Development.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/CapturesNative" --font-license
      - uses: actions/upload-artifact@v4
        with:
          name: native-development-macos-${{ runner.arch }}
          path: native-development-*.zip
          if-no-files-found: error
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"
