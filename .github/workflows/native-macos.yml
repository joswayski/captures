name: Native macOS experiment

on:
  pull_request:
    paths:
      - "experiments/macos-native/**"
      - "crates/captures-capture/**"
      - "crates/captures-recording/**"
      - "crates/captures-recording-macos/**"
      - "crates/captures-media/**"
      - "crates/captures-session/**"
      - "shared/design.css"
      - "shared/themes.css"
      - ".github/workflows/native-macos.yml"

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native:
    name: Compile and test native macOS (not a Preview)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Install test-only media tools
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v ffprobe >/dev/null
      - run: bash experiments/macos-native/check.sh
      - name: Archive the ad-hoc signed local-test app
        run: ditto -c -k --sequesterRsrc --keepParent 'experiments/macos-native/build/Captures Native Experiment.app' experiments/macos-native/build/Captures-Native-Experiment.zip
      - uses: actions/upload-artifact@v4
        with:
          name: captures-native-macos-experiment
          path: experiments/macos-native/build/Captures-Native-Experiment.zip
          if-no-files-found: error
      - name: Render native surface references
        timeout-minutes: 10
        env:
          CAPTURES_NATIVE_DATA: ${{ runner.temp }}/captures-native-render-profile
        run: bash experiments/macos-native/render.sh experiments/macos-native/build/references
      - uses: actions/upload-artifact@v4
        with:
          name: captures-native-macos-references
          path: experiments/macos-native/build/references/*.png
          if-no-files-found: error
      - name: Verify presented video and disintegration
        timeout-minutes: 10
        env:
          CAPTURES_NATIVE_CAPTURE_ANIMATION: "1"
        run: bash experiments/macos-native/render.sh experiments/macos-native/build/compositor-references
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-native-macos-compositor-references
          path: experiments/macos-native/build/compositor-references/*-compositor.png
          if-no-files-found: warn
          retention-days: 7
