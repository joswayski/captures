name: Native macOS workbench

on:
  pull_request:
    paths:
      - 'apps/native/**'
      - 'crates/captures-settings*/**'
      - 'crates/captures-app/**'
      - 'crates/captures-history/**'
      - 'crates/captures-image/**'
      - 'crates/captures-capture/**'
      - 'crates/captures-session/**'
      - 'Cargo.lock'
      - 'shared/**'
      - 'apps/desktop/ui/src/lib/thumbnailExit.ts'
      - 'apps/desktop/assets/icon.svg'
      - '.github/workflows/native-macos.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - run: bash apps/native/macos/build.sh
        env:
          CAPTURES_TEST_ARTIFACTS: ${{ runner.temp }}/native-pixels
      - name: Render native preferences
        run: |
          mkdir -p "$RUNNER_TEMP/native-preferences"
          for appearance in light dark; do
            apps/native/macos/.build/release/CapturesNative --scene preferences \
              --appearance "$appearance" --settings-file "$RUNNER_TEMP/native-preferences/$appearance.json" \
              --screenshot "$RUNNER_TEMP/native-preferences/$appearance.png" --quit-after 4
            test -s "$RUNNER_TEMP/native-preferences/$appearance.png"
          done
          apps/native/macos/.build/release/CapturesNative --live \
            --history-root "$RUNNER_TEMP/native-live-history" --appearance light \
            --screenshot "$RUNNER_TEMP/native-preferences/live-empty.png" --quit-after 4
          test -s "$RUNNER_TEMP/native-preferences/live-empty.png"
          python3 apps/native/history_fixture.py "$RUNNER_TEMP/native-populated-history"
          apps/native/macos/.build/release/CapturesNative --live \
            --history-root "$RUNNER_TEMP/native-populated-history" --appearance dark \
            --screenshot "$RUNNER_TEMP/native-preferences/live-populated.png" --quit-after 4
          test -s "$RUNNER_TEMP/native-preferences/live-populated.png"
      - name: Region selector diagnostics (not hardware acceptance)
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          sys.path.insert(0, "apps/native")
          from profile import trial
          binary = Path("apps/native/macos/.build/release/CapturesNative").resolve()
          output = Path(os.environ["RUNNER_TEMP"]) / "native-region-profile"
          output.mkdir()
          (output / "metadata.json").write_text(json.dumps({"platform": platform.platform(),
              "binarySHA256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "note": "One excluded warmup and one 30s trial; process CPU/RSS only, not footprint, GPU, WindowServer, input latency or acceptance."}, indent=2))
          for iteration in range(2):
              for active in ([False, True] if iteration == 0 else [True, False]):
                  result = trial(binary, output / f"{iteration}-region-{'active' if active else 'static'}",
                                 "region", active, False, 30)
                  print(iteration, active, result["summary"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-region-profile-macos
          path: ${{ runner.temp }}/native-region-profile
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-preferences-macos
          path: ${{ runner.temp }}/native-preferences
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pixels
          path: ${{ runner.temp }}/native-pixels
          if-no-files-found: ignore
      - run: python3 -m unittest discover -s apps/native -p 'test_*.py'
