name: macOS effect comparison build
on:
  pull_request:
    paths:
      - 'experiments/macos-parity/**'
      - 'apps/desktop/ui/src/lib/thumbnailExit.ts'
      - 'apps/desktop/ui/src/styles/mini-preview.css'
      - '.github/workflows/macos-parity.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          cache-workspaces: experiments/macos-parity/tauri -> target
      - run: npm ci
      - run: bash experiments/macos-parity/build.sh
      - run: experiments/macos-parity/.build/python/bin/python -m unittest discover -s experiments/macos-parity -p 'test_*.py'
        env:
          CAPTURES_NATIVE_PROFILE_TEST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-profile-smoke
          include-hidden-files: true
          path: experiments/macos-parity/.build/native-profile-*/**/*.json
