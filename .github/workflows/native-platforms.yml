name: Native Linux and Windows apps

on:
  pull_request:
    paths:
      - "experiments/linux-native/**"
      - "experiments/windows-native/**"
      - "experiments/native-ui/benchmark.py"
      - "experiments/native-ui/native_comparison.py"
      - "experiments/native-ui/test_native_comparison.py"
      - "crates/captures-capture/**"
      - "crates/captures-image/**"
      - "crates/captures-recording/**"
      - "crates/captures-recording-xcap/**"
      - "crates/captures-media/**"
      - "crates/captures-session/**"
      - "shared/design.css"
      - "shared/themes.css"
      - ".github/workflows/native-platforms.yml"

permissions:
  contents: read

jobs:
  linux:
    name: GTK4 Linux build and tests (not a Preview)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libclang-dev libssl-dev \
            libasound2-dev libdbus-1-dev libegl-dev libgbm-dev \
            libpipewire-0.3-dev libspa-0.2-dev libwayland-dev \
            libxcb1-dev libxrandr-dev ffmpeg
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path experiments/linux-native/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path experiments/linux-native/Cargo.toml
      - run: cargo clippy --locked --manifest-path experiments/linux-native/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --release --manifest-path experiments/linux-native/Cargo.toml
      - run: python3 -m unittest discover -s experiments/native-ui -p 'test_*.py'

  windows:
    name: Win32 Windows build and tests (not a Preview)
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Install and verify test-only media tools
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          foreach ($tool in @('ffmpeg', 'ffprobe', 'ffplay')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Missing $tool. Native media tests require all three tools."
            }
          }
      - run: cargo fmt --manifest-path experiments/windows-native/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path experiments/windows-native/Cargo.toml
      - run: cargo clippy --locked --manifest-path experiments/windows-native/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --release --manifest-path experiments/windows-native/Cargo.toml
