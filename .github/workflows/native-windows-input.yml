name: Native Windows keyboard transport

# Synthetic global input belongs on a disposable hosted desktop, NEVER on the
# maintainer's self-hosted Windows runner. No release/cutover authority here.
on:
  push:
    branches: [main, native/windows-shortcut-release]
    paths:
      - 'apps/native/windows_input_probe.py'
      - '.github/workflows/native-windows-input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        flags: ['', '--no-hotkeys']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure real raw-key and registered-hotkey delivery
        run: python apps/native/windows_input_probe.py --allow-input-injection ${{ matrix.flags }} --output native-input/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-keyboard-transport${{ matrix.flags }}
          path: native-input
          if-no-files-found: error
