name: Native Windows shortcut ownership

# Synthetic global input belongs on a disposable hosted desktop, NEVER on the
# maintainer's self-hosted Windows runner. No release/cutover authority here.
on:
  push:
    branches: [main]
    paths:
      - 'crates/captures-app/src/shortcuts.rs'
      - 'apps/native/windows_input_probe.py'
      - '.github/workflows/native-windows-input.yml'
  workflow_dispatch:
    inputs:
      probe_raw_input:
        description: 'Run the experimental raw-input prerequisite (currently expected to FAIL)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ownership:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          cache-workspaces: apps/native/wgpu
      - name: Diagnose native instance teardown
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          cargo +1.95.0 test --locked --target-dir apps/native/wgpu/target -p captures-session --lib instance:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($i = 0; $i -lt 25; $i++) {
            cargo +1.95.0 test --locked --target-dir apps/native/wgpu/target -p captures-settings-ffi --lib instance::
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify Windows shortcut command ownership
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          cargo +1.95.0 test --locked --target-dir apps/native/wgpu/target -p captures-app --lib shortcuts::
      - name: Investigate raw-input delivery with registered hotkeys
        if: inputs.probe_raw_input
        run: python apps/native/windows_input_probe.py --allow-input-injection --output native-input/default.json
      - name: Investigate the NOHOTKEYS foreground-only alternative
        if: always() && inputs.probe_raw_input
        run: python apps/native/windows_input_probe.py --allow-input-injection --no-hotkeys --output native-input/no-hotkeys.json
      - uses: actions/upload-artifact@v4
        if: always() && inputs.probe_raw_input
        with:
          name: native-windows-keyboard-transport
          path: native-input
          if-no-files-found: error

  allocation-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          cache-workspaces: apps/native/wgpu
      - name: Install private capture fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libdbus-1-dev libxcb1-dev libpipewire-0.3-dev libasound2-dev libegl-dev libgbm-dev libclang-dev mesa-vulkan-drivers libgl1-mesa-dri python3-dbus python3-gi sway swaybg pipewire xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-wlr grim meson ninja-build pkg-config libinih-dev libdrm-dev libsystemd-dev libevdev-dev libinput-dev libpixman-1-dev libjson-c-dev libpcre2-dev libffi-dev libexpat1-dev libcairo2-dev libpango1.0-dev wayland-protocols wireplumber python3-gi-cairo gir1.2-gtk-3.0 ffmpeg imagemagick
      - name: Repeat allocation with focused server tracing
        run: |
          set -euo pipefail
          node apps/native/prepare.mjs --output apps/native/wgpu/resources
          backend="$(apps/native/build_wayland_portal_fixture.sh "$RUNNER_TEMP/wayland-portal-fixture")"
          compositor="$(apps/native/build_wayland_compositor_fixture.sh "$RUNNER_TEMP/wayland-compositor-fixture")"
          cargo +1.95.0 build --manifest-path apps/native/wgpu/Cargo.toml --locked --bin wayland_video_probe --bin wayland_recording_probe --bin wayland_screenshot_probe
          for attempt in 1 2 3; do
            CAPTURES_PIPEWIRE_DEBUG=2,pw.link:4,mod.client-node:4 PATH="$compositor:$PATH" /usr/bin/python3 apps/native/wayland_video_smoke.py --binary apps/native/wgpu/target/debug/wayland_video_probe --recording-binary apps/native/wgpu/target/debug/wayland_recording_probe --screenshot-binary apps/native/wgpu/target/debug/wayland_screenshot_probe --wlr-backend "$backend" 2>&1 | tee "$RUNNER_TEMP/pipewire-trace-$attempt.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipewire-allocation-trace
          path: ${{ runner.temp }}/pipewire-trace-*.log
