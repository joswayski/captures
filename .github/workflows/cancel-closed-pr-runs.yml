name: Cancel closed PR runs

# A PR's runs are only superseded by a newer push to that same PR, so once it is
# merged or closed its queued and running jobs would otherwise keep holding
# runners (macOS especially) for hours. pull_request_target runs this file from
# the base branch with a token that may cancel runs; no PR code is checked out.
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    name: Cancel this PR's remaining runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel queued and running pull_request runs for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          branch="$(jq -rn --arg b "$HEAD_REF" '$b | @uri')"
          for status in queued in_progress waiting requested pending; do
            gh api --paginate "repos/$REPO/actions/runs?event=pull_request&branch=$branch&status=$status&per_page=100" \
              --jq '.workflow_runs[] | select(.head_repository.full_name == $ENV.HEAD_REPO) | .id'
          done | sort -u | while read -r id; do
            echo "Cancelling run $id"
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null || echo "::warning::Could not cancel run $id"
          done
