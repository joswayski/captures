name: Native PipeWire allocation investigation

on:
  push:
    branches: [fix/native-pipewire-memory]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          cache-workspaces: apps/native/wgpu
      - name: Install private desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libdbus-1-dev libxcb1-dev libpipewire-0.3-dev libasound2-dev libegl-dev libgbm-dev libclang-dev mesa-vulkan-drivers libgl1-mesa-dri python3-dbus python3-gi sway swaybg pipewire xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-wlr grim meson ninja-build pkg-config libinih-dev libdrm-dev libsystemd-dev libevdev-dev libinput-dev libpixman-1-dev libjson-c-dev libpcre2-dev libffi-dev libexpat1-dev libcairo2-dev libpango1.0-dev wayland-protocols wireplumber python3-gi-cairo gir1.2-gtk-3.0 ffmpeg imagemagick
      - name: Build and exercise the real portal stream
        run: |
          set -euo pipefail
          node apps/native/prepare.mjs --output apps/native/wgpu/resources
          backend="$(apps/native/build_wayland_portal_fixture.sh "$RUNNER_TEMP/wayland-portal-fixture")"
          compositor="$(apps/native/build_wayland_compositor_fixture.sh "$RUNNER_TEMP/wayland-compositor-fixture")"
          cargo +1.95.0 build --manifest-path apps/native/wgpu/Cargo.toml --locked --bin wayland_video_probe --bin wayland_recording_probe --bin wayland_screenshot_probe
          PATH="$compositor:$PATH" /usr/bin/python3 apps/native/wayland_video_smoke.py --binary apps/native/wgpu/target/debug/wayland_video_probe --recording-binary apps/native/wgpu/target/debug/wayland_recording_probe --screenshot-binary apps/native/wgpu/target/debug/wayland_screenshot_probe --wlr-backend "$backend" 2>&1 | tee "$RUNNER_TEMP/pipewire-trace.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipewire-allocation-trace
          path: ${{ runner.temp }}/pipewire-trace.log
