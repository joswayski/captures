name: AWS image

on:
  # Runs on main only; pull requests get no CI. Every main commit publishes its
  # immutable image.
  push:
    branches: [main]

permissions:
  contents: read

# Main pushes publish images and each keeps its own group so none is ever
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Builds and tests the image on GitHub's arm64 runners, which start in
  # seconds (the deploy path never queues behind a self-hosted machine), and
  # hands the tested image to the publish job.
  image-arm64:
    name: linux/arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners start empty, so they build in a BuildKit container
      # backed by GitHub's layer cache. Self-hosted runners use their own Docker
      # daemon, whose layer cache stays on the machine.
      - if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: captures:arm64
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          secrets: |
            github_token=${{ github.token }}
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max' || '' }}
      - name: Assert linux/arm64 image
        run: |
          os="$(docker image inspect captures:arm64 --format '{{.Os}}')"
          arch="$(docker image inspect captures:arm64 --format '{{.Architecture}}')"
          test "$os" = "linux"
          test "$arch" = "arm64"
          machine="$(docker run --rm --platform linux/arm64 --entrypoint uname captures:arm64 -m)"
          test "$machine" = "aarch64"
      - name: Verify the production health endpoint
        run: |
          container_id="$(docker run --detach --platform linux/arm64 --publish 127.0.0.1:3000:3000 captures:arm64)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          for _ in {1..30}; do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:3000/health)"; then
              test "$response" = '{"status":"ok"}'
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1
      - name: Export the tested image
        run: |
          set -euo pipefail
          docker save captures:arm64 | gzip -1 > "$RUNNER_TEMP/captures-web.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: captures-web-image
          path: ${{ runner.temp }}/captures-web.tar.gz
          retention-days: 1
          compression-level: 0

  publish-ecr:
    name: Publish immutable ECR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.record.outputs.image }}
      digest: ${{ steps.record.outputs.digest }}
    env:
      AWS_ACCOUNT_ID: "395451633568"
      AWS_REGION: us-east-1
      ECR_REGISTRY: 395451633568.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: production/captures
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::395451633568:role/production-captures-ecr-publisher
          role-session-name: captures-ecr-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Check for an existing immutable tag
        id: existing
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          name: captures-web-image
          path: ${{ runner.temp }}
      - name: Load the tested image
        if: steps.existing.outputs.exists != 'true'
        run: docker load --input "$RUNNER_TEMP/captures-web.tar.gz"
      - name: Log in to Amazon ECR
        if: steps.existing.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2.1.6
      - name: Push the tested linux/arm64 image
        id: push
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          docker tag captures:arm64 "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable image
        id: record
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
        run: |
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
          printf '### Published image\n\n`%s@%s`\n' "$image" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ship
      - name: Ship to production
        uses: ./.github/actions/ship
        with:
          repository: captures
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
