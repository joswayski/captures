name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional main-branch commit to rebuild as a historical release
        required: false
        type: string

permissions:
  contents: read

jobs:
  queue:
    name: Wait for earlier Nightlies
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.target.outputs.release_sha }}
      release_timestamp: ${{ steps.target.outputs.release_timestamp }}
    steps:
      - name: Restrict releases to main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Nightlies can only run from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the main commit to release
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          release_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          release_sha="$(git rev-parse "${release_sha}^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "${release_sha} is not a commit on main." >&2
            exit 1
          fi
          release_timestamp="$(git show -s --format=%cI "$release_sha")"
          {
            echo "release_sha=$release_sha"
            echo "release_timestamp=$release_timestamp"
          } >> "$GITHUB_OUTPUT"
      - name: Wait without dropping a main push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while true; do
            blocker="$(
              gh api \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&per_page=100" \
                --jq "[.workflow_runs[] | select(.id < ${GITHUB_RUN_ID} and .status != \"completed\") | .id] | min // empty"
            )"
            if [[ -z "$blocker" ]]; then
              break
            fi
            echo "Waiting for earlier Nightly workflow ${blocker} to finish."
            sleep 30
          done

  version:
    name: Choose Nightly version
    needs: queue
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      display_version: ${{ steps.version.outputs.display_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Choose the next CalVer
        id: version
        env:
          CAPTURES_RELEASE_TIMESTAMP: ${{ needs.queue.outputs.release_timestamp }}
        run: node scripts/release-version.mjs

  frontend:
    name: Frontend and release checks
    needs: queue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.queue.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust checks (${{ matrix.os }})
    needs: queue
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.queue.outputs.release_sha }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            pkg-config \
            wget
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  prepare:
    name: Stage Nightly
    needs: [queue, version, frontend, rust]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      app_version: ${{ needs.version.outputs.app_version }}
      display_version: ${{ needs.version.outputs.display_version }}
      release_sha: ${{ needs.queue.outputs.release_sha }}
      release_id: ${{ steps.draft.outputs.release_id }}
      release_notes: ${{ steps.draft.outputs.release_notes }}
      tag: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.queue.outputs.release_sha }}
      - name: Create the draft at the tested commit
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
          RELEASE_SHA: ${{ needs.queue.outputs.release_sha }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          stale_release_ids="$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq \
                -r \
                --arg tag "$TAG" \
                '.[] | select(.draft and .tag_name == $tag) | .id'
          )"
          while IFS= read -r stale_release_id; do
            if [[ -z "$stale_release_id" ]]; then
              continue
            fi
            echo "Removing stale draft release ${stale_release_id} for ${TAG}."
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${stale_release_id}" \
              --silent
          done <<< "$stale_release_ids"

          release_id=""
          tag_owned=false
          cleanup_failed_stage() {
            if [[ -n "$release_id" ]]; then
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                --silent \
                2>/dev/null \
                || true
            fi
            if [[ "$tag_owned" == "true" ]]; then
              git push origin --delete "$TAG" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_failed_stage EXIT

          if git ls-remote \
            --exit-code \
            --tags \
            origin \
            "refs/tags/${TAG}" \
            >/dev/null 2>&1; then
            git fetch \
              --force \
              origin \
              "refs/tags/${TAG}:refs/tags/${TAG}"
            existing_sha="$(git rev-parse "${TAG}^{commit}")"
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag ${TAG} already points to ${existing_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/${TAG}"
            tag_owned=true
          fi

          release_file="$RUNNER_TEMP/release.json"
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$RELEASE_SHA" \
            -f name="Captures Nightly $DISPLAY_VERSION" \
            -F draft=true \
            -F generate_release_notes=true \
            > "$release_file"
          release_id="$(jq -er .id "$release_file")"
          generated_notes="$RUNNER_TEMP/generated-release-notes.md"
          jq -r '.body // ""' "$release_file" > "$generated_notes"
          {
            echo "> [!WARNING]"
            echo "> This Nightly is functional, but experimental. Expect bugs and incomplete features; macOS is the primary development target, while Windows and Linux may be less polished."
            echo
            if [[ -s "$generated_notes" ]]; then
              cat "$generated_notes"
            else
              echo "Automated build of commit ${RELEASE_SHA:0:7}."
            fi
          } > "$notes_file"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f body="$(cat "$notes_file")" \
            --silent
          delimiter="captures-release-notes-${GITHUB_RUN_ID}"
          {
            echo "release_id=$release_id"
            echo "release_notes<<$delimiter"
            cat "$notes_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          trap - EXIT

  package:
    name: Package ${{ matrix.name }}
    needs: prepare
    environment: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    env:
      CAPTURES_RELEASE_CHANNEL: nightly
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Load the current release asset helper
        if: runner.os == 'macOS'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/github-release-assets.mjs
          sparse-checkout-cone-mode: false
          path: release-tools
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            patchelf \
            nasm \
            pkg-config \
            wget \
            xdg-utils \
            xz-utils \
            yasm \
            zlib1g-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            base-devel
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-zlib
      - run: npm ci
      - name: Build and validate the pinned LGPL media sidecars
        if: runner.os != 'Windows'
        run: npm run prepare:media
      - name: Build and validate the pinned LGPL Windows media sidecars
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-sidecars.sh
      - name: Prepare the release-only version
        if: runner.os != 'macOS'
        run: node scripts/prepare-release-build.mjs "${{ needs.prepare.outputs.app_version }}"
      - name: Prepare the release-only version and Apple credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: node scripts/prepare-release-build.mjs "${{ needs.prepare.outputs.app_version }}"
      - name: Import and verify the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/captures-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$APPLE_CERTIFICATE_PATH" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F\" '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "The certificate is not a Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json
          projectPath: apps/desktop
          releaseBody: ${{ needs.prepare.outputs.release_notes }}
          releaseDraft: true
          releaseId: ${{ needs.prepare.outputs.release_id }}
          retryAttempts: 5
          tagName: ${{ needs.prepare.outputs.tag }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Notarize, staple, and validate the macOS release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail

          app="target/${{ matrix.target }}/release/bundle/macos/Captures.app"
          dmg="$(
            find "target/${{ matrix.target }}/release/bundle/dmg" \
              -maxdepth 1 \
              -type f \
              -name '*.dmg' \
              -print \
              -quit
          )"
          if [[ ! -d "$app" || -z "$dmg" ]]; then
            echo "Could not find the packaged Captures.app and DMG." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple -v "$dmg"

          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "$dmg"
          xcrun stapler validate "$dmg"

          node "$GITHUB_WORKSPACE/release-tools/scripts/github-release-assets.mjs" \
            upload \
            "$RELEASE_ID" \
            "$dmg"
      - name: Validate the packaged media sidecars and notices
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/Captures.app"
          ffmpeg="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffmpeg*' -print -quit)"
          ffprobe="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffprobe*' -print -quit)"
          test -n "$ffmpeg"
          test -n "$ffprobe"
          test -f "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
          test -f "$app/Contents/Resources/notices/ffmpeg/COPYING.LGPLv2.1"
          test -f "$app/Contents/Resources/notices/ffmpeg/NOTICE.md"
          test -f "$app/Contents/Resources/notices/openh264/LICENSE"
          test -f "$app/Contents/Resources/notices/openh264/NOTICE.md"
          node scripts/validate-ffmpeg-sidecars.mjs \
            "$ffmpeg" \
            "$ffprobe" \
            "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
      - name: Attach FFmpeg source and compliance files
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: >-
          node "$GITHUB_WORKSPACE/release-tools/scripts/github-release-assets.mjs"
          upload
          "$RELEASE_ID"
          target/ffmpeg-dist/*

  validate_draft:
    name: Validate staged release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and validate the complete staged release
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          node scripts/github-release-assets.mjs download "$RELEASE_ID" release-assets
          node scripts/release-assets.mjs release-assets "$APP_VERSION"
          node scripts/github-release-assets.mjs upload "$RELEASE_ID" release-assets/SHA256SUMS
      - name: Confirm the release remains a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          draft="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq .draft
          )"
          if [[ "$draft" != "true" ]]; then
            echo "Release $TAG was unexpectedly published." >&2
            exit 1
          fi

  publish:
    name: Publish Nightly
    needs: [prepare, validate_draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the fully validated Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f tag_name="$TAG" \
            -f target_commitish="$RELEASE_SHA" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            --silent
          published="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq '[.draft, .prerelease, .tag_name] | @tsv'
          )"
          if [[ "$published" != $'false\ttrue\t'"$TAG" ]]; then
            echo "Nightly ${TAG} was not published as expected." >&2
            exit 1
          fi

  channel:
    name: Update Nightly channel
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Point the rolling channel at the greatest Nightly version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          releases_file="$RUNNER_TEMP/releases.json"
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -s add \
            > "$releases_file"
          newest_tag="$(node scripts/nightly-release.mjs "$releases_file")"
          newest_release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${newest_tag}"
          )"
          newest_name="$(jq -er .name <<< "$newest_release")"
          newest_target="$(jq -er .target_commitish <<< "$newest_release")"
          newest_url="$(jq -er .html_url <<< "$newest_release")"

          channel_notes="$RUNNER_TEMP/nightly-channel-notes.md"
          {
            echo "> [!WARNING]"
            echo "> Captures Nightly is functional, but experimental. Expect bugs and incomplete features; macOS is the primary development target, while Windows and Linux may be less polished."
            echo
            echo "The newest validated build is [${newest_name}](${newest_url})."
            echo "Versioned Nightlies remain available as a permanent build history."
          } > "$channel_notes"

          channel_release="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              2>/dev/null \
              || true
          )"
          if [[ -z "$channel_release" ]]; then
            channel_release="$(
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name=nightly \
                -f target_commitish="$newest_target" \
                -f name="Captures Nightly — Latest" \
                -f body="$(cat "$channel_notes")" \
                -F draft=false \
                -F prerelease=true \
                -f make_latest=false
            )"
          else
            channel_id="$(jq -er .id <<< "$channel_release")"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${channel_id}" \
              -f name="Captures Nightly — Latest" \
              -f body="$(cat "$channel_notes")" \
              -F draft=false \
              -F prerelease=true \
              -f make_latest=false \
              --silent
          fi

          channel_assets="$RUNNER_TEMP/nightly-channel"
          mkdir "$channel_assets"
          gh release download \
            "$newest_tag" \
            --pattern latest.json \
            --dir "$channel_assets"
          gh release upload \
            nightly \
            "$channel_assets/latest.json" \
            --clobber
          channel_manifest="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '.assets[] | select(.name == "latest.json") | .browser_download_url'
          )"
          if [[ -z "$channel_manifest" ]]; then
            echo "The rolling Nightly channel is missing latest.json." >&2
            exit 1
          fi

  cleanup:
    name: Remove incomplete Nightly
    if: ${{ always() && needs.prepare.result == 'success' && needs.publish.result != 'success' }}
    needs: [prepare, package, validate_draft, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Remove the failed draft and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          release="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              2>/dev/null \
              || true
          )"
          if [[ -z "$release" ]]; then
            exit 0
          fi
          if [[ "$(jq -r .draft <<< "$release")" != "true" ]]; then
            echo "Refusing to remove published release ${TAG}." >&2
            exit 1
          fi
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --silent
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            --silent \
            2>/dev/null \
            || true
