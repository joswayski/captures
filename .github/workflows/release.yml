name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue:
    name: Wait for earlier releases
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Restrict releases to main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases can only run from main." >&2
            exit 1
          fi
      - name: Wait without dropping a main push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while true; do
            blocker="$(
              gh api \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&per_page=100" \
                --jq "[.workflow_runs[] | select(.id < ${GITHUB_RUN_ID} and .status != \"completed\") | .id] | min // empty"
            )"
            if [[ -z "$blocker" ]]; then
              break
            fi
            echo "Waiting for earlier release workflow ${blocker} to finish."
            sleep 30
          done

  frontend:
    name: Frontend and release checks
    needs: queue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust checks (${{ matrix.os }})
    needs: queue
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            pkg-config \
            wget
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  prepare:
    name: Create draft release
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      display_version: ${{ steps.version.outputs.display_version }}
      release_id: ${{ steps.draft.outputs.release_id }}
      release_notes: ${{ steps.draft.outputs.release_notes }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Choose the next CalVer
        id: version
        run: node scripts/release-version.mjs
      - name: Create the draft at the tested commit
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          stale_release_ids="$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq \
                -r \
                --arg tag "$TAG" \
                --arg name "Captures $DISPLAY_VERSION" \
                '.[] | select(.draft and .tag_name == $tag and .name == $name) | .id'
          )"
          while IFS= read -r stale_release_id; do
            if [[ -z "$stale_release_id" ]]; then
              continue
            fi
            echo "Removing stale draft release ${stale_release_id} for ${TAG}."
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${stale_release_id}" \
              --silent
          done <<< "$stale_release_ids"

          release_file="$RUNNER_TEMP/release.json"
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Captures $DISPLAY_VERSION" \
            -F draft=true \
            -F generate_release_notes=true \
            > "$release_file"
          release_id="$(jq -er .id "$release_file")"
          jq -r '.body // ""' "$release_file" > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            fallback_notes="Automated build of commit ${GITHUB_SHA:0:7}."
            echo "$fallback_notes" > "$notes_file"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f body="$fallback_notes" \
              --silent
          fi
          delimiter="captures-release-notes-${GITHUB_RUN_ID}"
          {
            echo "release_id=$release_id"
            echo "release_notes<<$delimiter"
            cat "$notes_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.name }}
    needs: prepare
    environment: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    env:
      CAPTURES_OFFICIAL_RELEASE: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            patchelf \
            nasm \
            pkg-config \
            wget \
            xdg-utils \
            xz-utils \
            yasm \
            zlib1g-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            base-devel
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-zlib
      - run: npm ci
      - name: Build and validate the pinned LGPL media sidecars
        if: runner.os != 'Windows'
        run: npm run prepare:media
      - name: Build and validate the pinned LGPL Windows media sidecars
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-sidecars.sh
      - name: Prepare the release-only version and credentials
        run: node scripts/prepare-release-build.mjs "${{ needs.prepare.outputs.app_version }}"
      - name: Import and verify the Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/captures-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$APPLE_CERTIFICATE_PATH" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F\" '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "The certificate is not a Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json
          projectPath: apps/desktop
          releaseBody: ${{ needs.prepare.outputs.release_notes }}
          releaseDraft: true
          releaseId: ${{ needs.prepare.outputs.release_id }}
          retryAttempts: 5
          tagName: ${{ needs.prepare.outputs.tag }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Validate the packaged media sidecars and notices
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/Captures.app"
          ffmpeg="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffmpeg*' -print -quit)"
          ffprobe="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffprobe*' -print -quit)"
          test -n "$ffmpeg"
          test -n "$ffprobe"
          test -f "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
          test -f "$app/Contents/Resources/notices/ffmpeg/COPYING.LGPLv2.1"
          test -f "$app/Contents/Resources/notices/ffmpeg/NOTICE.md"
          test -f "$app/Contents/Resources/notices/openh264/LICENSE"
          test -f "$app/Contents/Resources/notices/openh264/NOTICE.md"
          node scripts/validate-ffmpeg-sidecars.mjs \
            "$ffmpeg" \
            "$ffprobe" \
            "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
      - name: Attach FFmpeg source and compliance files
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release upload "$TAG" target/ffmpeg-dist/* --clobber

  publish:
    name: Validate and publish release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and validate the complete draft
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          mkdir release-assets
          gh release download "$TAG" --dir release-assets
          node scripts/release-assets.mjs release-assets "$APP_VERSION"
          gh release upload "$TAG" release-assets/SHA256SUMS --clobber
      - name: Publish and mark latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease=false --latest

  cleanup:
    name: Remove incomplete release
    if: ${{ always() && needs.prepare.result == 'success' && needs.publish.result != 'success' }}
    needs: [prepare, package, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Remove the failed draft and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release delete "$TAG" --cleanup-tag --yes
