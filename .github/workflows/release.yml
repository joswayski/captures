name: Captures Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional main-branch commit to rebuild as a historical release
        required: false
        type: string

# cancel-in-progress: false only protects the running run. queue: max keeps
# later main pushes pending (up to 100) instead of cancelling the middle SHA.
concurrency:
  group: captures-preview-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  queue:
    name: Wait for earlier Preview builds
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.target.outputs.release_sha }}
      release_timestamp: ${{ steps.target.outputs.release_timestamp }}
      should_release: ${{ steps.scope.outputs.should_release }}
    steps:
      - name: Restrict releases to main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Preview builds can only run from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the main commit to release
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          release_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          release_sha="$(git rev-parse "${release_sha}^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "${release_sha} is not a commit on main." >&2
            exit 1
          fi
          release_timestamp="$(git show -s --format=%cI "$release_sha")"
          {
            echo "release_sha=$release_sha"
            echo "release_timestamp=$release_timestamp"
          } >> "$GITHUB_OUTPUT"
      - name: Check for installed-app changes
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ steps.target.outputs.release_sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual Preview builds always run."
          else
            node scripts/desktop-release.mjs changed "$BEFORE_SHA" "$RELEASE_SHA"
          fi
      - name: Wait without dropping a main push
        if: steps.scope.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/wait-preview-queue.sh

  version:
    name: Choose Preview version
    needs: queue
    if: needs.queue.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      display_version: ${{ steps.version.outputs.display_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Choose the next CalVer
        id: version
        env:
          CAPTURES_RELEASE_TIMESTAMP: ${{ needs.queue.outputs.release_timestamp }}
        run: node scripts/release-version.mjs

  frontend:
    name: Frontend and release checks
    needs: queue
    if: needs.queue.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.queue.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  rust:
    name: Rust checks (${{ matrix.os }})
    needs: queue
    if: needs.queue.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.queue.outputs.release_sha }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            pkg-config \
            wget
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  prepare:
    name: Stage Preview
    needs: [queue, version, frontend, rust]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      app_version: ${{ needs.version.outputs.app_version }}
      display_version: ${{ needs.version.outputs.display_version }}
      release_sha: ${{ needs.queue.outputs.release_sha }}
      release_id: ${{ steps.draft.outputs.release_id }}
      release_notes: ${{ steps.draft.outputs.release_notes }}
      tag: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.queue.outputs.release_sha }}
      # Historical builds check out an older target SHA, so load the scope and
      # notes helper from the workflow commit instead of requiring it there.
      - name: Load the current desktop release helper
        uses: actions/checkout@v4
        with:
          path: release-tools
          ref: ${{ github.sha }}
          sparse-checkout: scripts/desktop-release.mjs
          sparse-checkout-cone-mode: false
      - name: Create the draft at the tested commit
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_VERSION: ${{ needs.version.outputs.display_version }}
          RELEASE_SHA: ${{ needs.queue.outputs.release_sha }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          stale_release_ids="$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq \
                -r \
                --arg tag "$TAG" \
                '.[] | select(.draft and .tag_name == $tag) | .id'
          )"
          while IFS= read -r stale_release_id; do
            if [[ -z "$stale_release_id" ]]; then
              continue
            fi
            echo "Removing stale draft release ${stale_release_id} for ${TAG}."
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${stale_release_id}" \
              --silent
          done <<< "$stale_release_ids"

          release_id=""
          tag_owned=false
          cleanup_failed_stage() {
            if [[ -n "$release_id" ]]; then
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                --silent \
                2>/dev/null \
                || true
            fi
            if [[ "$tag_owned" == "true" ]]; then
              git push origin --delete "$TAG" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_failed_stage EXIT

          if git ls-remote \
            --exit-code \
            --tags \
            origin \
            "refs/tags/${TAG}" \
            >/dev/null 2>&1; then
            git fetch \
              --force \
              origin \
              "refs/tags/${TAG}:refs/tags/${TAG}"
            existing_sha="$(git rev-parse "${TAG}^{commit}")"
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag ${TAG} already points to ${existing_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/${TAG}"
            tag_owned=true
          fi

          release_file="$RUNNER_TEMP/release.json"
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$RELEASE_SHA" \
            -f name="Captures Preview $DISPLAY_VERSION" \
            -F draft=true \
            > "$release_file"
          release_id="$(jq -er .id "$release_file")"
          generated_notes="$RUNNER_TEMP/generated-release-notes.md"
          node "$GITHUB_WORKSPACE/release-tools/scripts/desktop-release.mjs" notes \
            "$RELEASE_SHA" \
            "$GITHUB_REPOSITORY" \
            "$generated_notes"
          {
            echo "> [!WARNING]"
            echo "> This Preview is functional, but experimental. Expect bugs and incomplete features; macOS is the primary development target, while Windows and Linux may be less polished."
            echo
            if [[ -s "$generated_notes" ]]; then
              cat "$generated_notes"
            else
              echo "Automated build of commit ${RELEASE_SHA:0:7}."
            fi
          } > "$notes_file"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f body="$(cat "$notes_file")" \
            --silent
          delimiter="captures-release-notes-${GITHUB_RUN_ID}"
          {
            echo "release_id=$release_id"
            echo "release_notes<<$delimiter"
            cat "$notes_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          trap - EXIT

  package:
    name: Package ${{ matrix.name }}
    needs: prepare
    environment: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    env:
      CAPTURES_RELEASE_CHANNEL: preview
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      # Historical package jobs check out the tested SHA, then overlay the
      # current upload helper so URL rewriting stays current. Include every
      # local import of github-release-assets.mjs or Node cannot load it.
      - name: Load the current release asset helper
        if: runner.os == 'macOS'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/github-release-assets.mjs
            scripts/release-assets.mjs
          sparse-checkout-cone-mode: false
          path: release-tools
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            patchelf \
            nasm \
            pkg-config \
            wget \
            xdg-utils \
            xz-utils \
            yasm \
            zlib1g-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            base-devel
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-zlib
      - run: npm ci
      - name: Build and validate the pinned LGPL media sidecars
        if: runner.os != 'Windows'
        run: npm run prepare:media
      - name: Build and validate the pinned LGPL Windows media sidecars
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-sidecars.sh
      - name: Prepare the release-only version
        if: runner.os != 'macOS'
        run: node scripts/prepare-release-build.mjs "${{ needs.prepare.outputs.app_version }}"
      - name: Prepare the release-only version and Apple credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: node scripts/prepare-release-build.mjs "${{ needs.prepare.outputs.app_version }}"
      - name: Import and verify the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/captures-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$APPLE_CERTIFICATE_PATH" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F\" '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "The certificate is not a Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json
          projectPath: apps/desktop
          releaseBody: ${{ needs.prepare.outputs.release_notes }}
          releaseDraft: true
          releaseId: ${{ needs.prepare.outputs.release_id }}
          retryAttempts: 5
          tagName: ${{ needs.prepare.outputs.tag }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Notarize, staple, and validate the macOS release
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail

          app="target/${{ matrix.target }}/release/bundle/macos/Captures.app"
          dmg="$(
            find "target/${{ matrix.target }}/release/bundle/dmg" \
              -maxdepth 1 \
              -type f \
              -name '*.dmg' \
              -print \
              -quit
          )"
          if [[ ! -d "$app" || -z "$dmg" ]]; then
            echo "Could not find the packaged Captures.app and DMG." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple -v "$dmg"

          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "$dmg"
          xcrun stapler validate "$dmg"

          node "$GITHUB_WORKSPACE/release-tools/scripts/github-release-assets.mjs" \
            upload \
            "$RELEASE_ID" \
            "$dmg"
      - name: Validate the packaged media sidecars and notices
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="target/${{ matrix.target }}/release/bundle/macos/Captures.app"
          ffmpeg="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffmpeg*' -print -quit)"
          ffprobe="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffprobe*' -print -quit)"
          test -n "$ffmpeg"
          test -n "$ffprobe"
          test -f "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
          test -f "$app/Contents/Resources/notices/ffmpeg/COPYING.LGPLv2.1"
          test -f "$app/Contents/Resources/notices/ffmpeg/NOTICE.md"
          test -f "$app/Contents/Resources/notices/openh264/LICENSE"
          test -f "$app/Contents/Resources/notices/openh264/NOTICE.md"
          node scripts/validate-ffmpeg-sidecars.mjs \
            "$ffmpeg" \
            "$ffprobe" \
            "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
      - name: Attach FFmpeg source and compliance files
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: >-
          node "$GITHUB_WORKSPACE/release-tools/scripts/github-release-assets.mjs"
          upload
          "$RELEASE_ID"
          target/ffmpeg-dist/*

  validate_draft:
    name: Validate staged release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and validate the complete staged release
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          node scripts/github-release-assets.mjs download "$RELEASE_ID" release-assets
          # GitHub draft releases report tag_name as untagged-* even when the
          # CalVer git tag already exists. Pass that tag explicitly so latest.json
          # keeps publishable download URLs before checksums are frozen.
          node scripts/github-release-assets.mjs rewrite-updater-urls "$RELEASE_ID" release-assets/latest.json "$TAG"
          node scripts/release-assets.mjs release-assets "$APP_VERSION"
          node scripts/github-release-assets.mjs upload "$RELEASE_ID" release-assets/SHA256SUMS release-assets/latest.json
      - name: Confirm the release remains a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          draft="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq .draft
          )"
          if [[ "$draft" != "true" ]]; then
            echo "Release $TAG was unexpectedly published." >&2
            exit 1
          fi

  publish:
    name: Publish Preview
    needs: [prepare, validate_draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the fully validated Preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f tag_name="$TAG" \
            -f target_commitish="$RELEASE_SHA" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            --silent
          published="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq '[.draft, .prerelease, .tag_name] | @tsv'
          )"
          if [[ "$published" != $'false\ttrue\t'"$TAG" ]]; then
            echo "Preview ${TAG} was not published as expected." >&2
            exit 1
          fi

  channel:
    name: Update latest Preview
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish the greatest Preview on the permanent download page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          releases_file="$RUNNER_TEMP/releases.json"
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -s add \
            > "$releases_file"
          while IFS= read -r release; do
            release_id="$(jq -er .id <<< "$release")"
            release_tag="$(jq -er .tag_name <<< "$release")"
            current_name="$(jq -r '.name // ""' <<< "$release")"
            current_body="$(jq -r '.body // ""' <<< "$release")"
            preview_name="Captures Preview ${release_tag#v}"
            preview_body="${current_body//This Nightly/This Preview}"
            preview_body="${preview_body//Captures Nightly/Captures Preview}"
            if [[ "$current_name" != "$preview_name" || "$current_body" != "$preview_body" ]]; then
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -f name="$preview_name" \
                -f body="$preview_body" \
                --silent
            fi
          done < <(
            jq -c \
              '.[] | select(.draft == false and .prerelease == true and (.tag_name | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[1-9][0-9]?$")))' \
              "$releases_file"
          )

          newest_tag="$(node scripts/preview-release.mjs "$releases_file")"
          newest_release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${newest_tag}"
          )"
          newest_name="$(jq -er .name <<< "$newest_release")"
          newest_target="$(jq -er .target_commitish <<< "$newest_release")"
          newest_url="$(jq -er .html_url <<< "$newest_release")"

          channel_assets="$RUNNER_TEMP/preview-channel"
          mkdir "$channel_assets"
          gh release download \
            "$newest_tag" \
            --pattern '*.dmg' \
            --pattern '*-setup.exe' \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern latest.json \
            --dir "$channel_assets"
          # Rename versioned packages to stable channel names so README and
          # release-page download links always point at the latest Preview.
          preview_assets="$(
            node scripts/preview-release-assets.mjs prepare "$channel_assets"
          )"
          node scripts/preview-changelog.mjs apply \
            "$channel_assets/latest.json" \
            "$releases_file"
          newest_id="$(jq -er .id <<< "$newest_release")"
          node scripts/github-release-assets.mjs rewrite-updater-urls \
            "$newest_id" \
            "$channel_assets/latest.json" \
            "$newest_tag"
          macos_asset="$(jq -er .macos <<< "$preview_assets")"
          windows_asset="$(jq -er .windows <<< "$preview_assets")"
          linux_deb_asset="$(jq -er .linuxDeb <<< "$preview_assets")"
          linux_appimage_asset="$(jq -er .linuxAppImage <<< "$preview_assets")"
          updater_asset="$(jq -er .updater <<< "$preview_assets")"

          asset_url() {
            encoded_asset="$(jq -rn --arg asset "$1" '$asset | @uri')"
            printf 'https://github.com/%s/releases/download/preview/%s' \
              "$GITHUB_REPOSITORY" \
              "$encoded_asset"
          }

          channel_notes="$RUNNER_TEMP/preview-channel-notes.md"
          {
            echo "> [!WARNING]"
            echo "> Captures Preview is functional, but experimental. Expect bugs and incomplete features; macOS is the primary development target, while Windows and Linux may be less polished."
            echo
            echo "Download the latest validated build (these links always track the newest Preview):"
            echo
            echo "- [macOS 13+ — Apple silicon (.dmg)]($(asset_url "$macos_asset"))"
            echo "- [Windows 11 — x64 installer (.exe)]($(asset_url "$windows_asset"))"
            echo "- [Ubuntu or Debian — x64 package (.deb)]($(asset_url "$linux_deb_asset"))"
            echo "- [Other Linux distributions — x64 AppImage]($(asset_url "$linux_appimage_asset"))"
            echo
            echo 'The `latest.json` asset is updater metadata, not a manual download.'
            echo
            echo "Current version: [${newest_name}](${newest_url})."
            echo "[Browse the dated build archive](https://github.com/${GITHUB_REPOSITORY}/releases)."
          } > "$channel_notes"

          channel_release=""
          if ! channel_release="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/preview" \
              2>/dev/null
          )"; then
            channel_release=""
          fi
          if [[ -z "$channel_release" ]]; then
            while IFS= read -r stale_channel_id; do
              if [[ -n "$stale_channel_id" ]]; then
                gh api \
                  --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/${stale_channel_id}" \
                  --silent
              fi
            done < <(
              jq -r \
                '.[] | select(.draft and (.tag_name == "preview" or .name == "Captures Preview — Latest")) | .id' \
                "$releases_file"
            )
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/preview" \
              --silent \
              2>/dev/null \
              || true
            channel_release="$(
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name=preview \
                -f target_commitish="$newest_target" \
                -f name="Captures Preview — Latest" \
                -F draft=true \
                -f make_latest=false
            )"
          fi
          channel_id="$(jq -er .id <<< "$channel_release")"
          node scripts/github-release-assets.mjs sync "$channel_id" "$channel_assets"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${channel_id}" \
            -f tag_name=preview \
            -f target_commitish="$newest_target" \
            -f name="Captures Preview — Latest" \
            -f body="$(cat "$channel_notes")" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            --silent

          expected_assets="$(
            jq -cn \
              --arg macos "$macos_asset" \
              --arg windows "$windows_asset" \
              --arg linuxDeb "$linux_deb_asset" \
              --arg linuxAppImage "$linux_appimage_asset" \
              --arg updater "$updater_asset" \
              '[$macos, $windows, $linuxDeb, $linuxAppImage, $updater] | sort'
          )"
          channel_release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${channel_id}"
          )"
          actual_assets="$(jq -c '[.assets[].name] | sort' <<< "$channel_release")"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "The permanent Preview page does not contain exactly the expected downloads." >&2
            echo "Expected: $expected_assets" >&2
            echo "Actual:   $actual_assets" >&2
            exit 1
          fi
          if [[ "$(jq -r '[.draft, .prerelease, .tag_name, .name] | @tsv' <<< "$channel_release")" != $'false\ttrue\tpreview\tCaptures Preview — Latest' ]]; then
            echo "The permanent Preview page metadata is incorrect." >&2
            exit 1
          fi

          legacy_release=""
          if ! legacy_release="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              2>/dev/null
          )"; then
            legacy_release=""
          fi
          if [[ -n "$legacy_release" ]]; then
            legacy_release_id="$(jq -er .id <<< "$legacy_release")"
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${legacy_release_id}" \
              --silent
          fi
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
            --silent \
            2>/dev/null \
            || true

  cleanup:
    name: Remove incomplete Preview
    if: ${{ always() && needs.prepare.result == 'success' && needs.publish.result != 'success' }}
    needs: [prepare, package, validate_draft, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Remove the failed draft and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          release="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              2>/dev/null \
              || true
          )"
          if [[ -z "$release" ]]; then
            exit 0
          fi
          if [[ "$(jq -r .draft <<< "$release")" != "true" ]]; then
            echo "Refusing to remove published release ${TAG}." >&2
            exit 1
          fi
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --silent
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            --silent \
            2>/dev/null \
            || true
