name: CI

# Every push to main runs the fast gate (frontend, account API, Rust on all three
# OSes and native wgpu lint/unit checks, about 10 minutes). The unsigned installer
# builds (10-20 minutes each) run nightly and on "Run workflow", which also tests
# a branch. Pull requests get no CI.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# A running push build always finishes and only the newest waiting push runs
# next (it checks every commit before it), so bursts of pushes don't fill the
# shared runner pool that image builds and Ship need. Manual and nightly runs
# replace older ones of the same kind on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
      - run: npm ci
      - run: npm run check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  accounts:
    name: Account database and API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - run: cargo test -p captures-api -- --include-ignored
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: docker build -f apps/api/Dockerfile -t captures-api:test .

  # The fast part of the nightly Native wgpu workbench: rustfmt, unit tests and
  # clippy for apps/native/wgpu (its ruff, Python and token tests run in
  # `npm run check` above). Its GUI smokes and packages stay nightly.
  native:
    name: Native wgpu checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/wgpu
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Azure apt mirror sometimes trickles: downloads run separately so
      # each retry resumes partial files, later attempts switch to
      # archive.ubuntu.com, and the .debs are cached between runs.
      - name: Restore cached apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: native-wgpu-apt-ubuntu-24.04-v1
      - name: Install Linux windowing and software-rendering test dependencies
        timeout-minutes: 15
        run: |
          packages="
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev
            libxi-dev libxrandr-dev libdbus-1-dev libxcb1-dev libpipewire-0.3-dev
            libasound2-dev libasound2-plugins pulseaudio libegl-dev libgbm-dev libclang-dev
            mesa-vulkan-drivers libgl1-mesa-dri xvfb dbus python3-dbus python3-gi
            python3-xlib openbox picom hsetroot sway wl-clipboard xclip xdotool x11-utils
            x11-apps imagemagick xfce4-panel xdg-utils ffmpeg"
          if compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/
          fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          downloaded=
          for attempt in 1 2 3 4; do
            if [ "$attempt" -ge 3 ]; then
              echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            if timeout 180 sudo apt-get $apt_opts update &&
               timeout 240 sudo apt-get $apt_opts install -y --download-only $packages; then
              downloaded=1
              break
            fi
            echo "apt download attempt $attempt failed; retrying"
            sleep 10
          done
          test -n "$downloaded"
          sudo apt-get install -y --no-download $packages
          mkdir -p "$HOME/apt-archives"
          cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/"
      - run: node apps/native/prepare.mjs --output apps/native/wgpu/resources
      - run: cargo +1.95.0 fmt --manifest-path apps/native/wgpu/Cargo.toml --all -- --check
      - run: cargo +1.95.0 test --manifest-path apps/native/wgpu/Cargo.toml --locked
      - run: cargo +1.95.0 clippy --manifest-path apps/native/wgpu/Cargo.toml --locked --all-targets -- -D warnings

  # The Linux GTK4 host that replaces the egui/wgpu UI on Linux (see
  # docs/native-rewrite.md): rustfmt, clippy, and a headless Preferences render.
  native-gtk:
    name: Native GTK4 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/gtk
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # captures-app links the shared capture stack (PipeWire, D-Bus, X11/Wayland, ALSA).
      # The Azure apt mirror sometimes trickles: downloads run separately so
      # each retry resumes partial files, later attempts switch to
      # archive.ubuntu.com, and the .debs are cached between runs.
      - name: Restore cached apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: native-gtk-apt-ubuntu-24.04-v2
      - name: Install GTK4 and capture-stack libraries
        timeout-minutes: 15
        run: |
          packages="libgtk-4-dev xvfb xdotool dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0
            gir1.2-gdkpixbuf-2.0 libpipewire-0.3-dev libclang-dev libdbus-1-dev libwayland-dev
            libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcb1-dev libasound2-dev
            libegl-dev libgbm-dev ffmpeg"
          if compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/
          fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          downloaded=
          for attempt in 1 2 3 4; do
            if [ "$attempt" -ge 3 ]; then
              echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            if timeout 180 sudo apt-get $apt_opts update &&
               timeout 240 sudo apt-get $apt_opts install -y --download-only $packages; then
              downloaded=1
              break
            fi
            echo "apt download attempt $attempt failed; retrying"
            sleep 10
          done
          test -n "$downloaded"
          sudo apt-get install -y --no-download $packages
          mkdir -p "$HOME/apt-archives"
          cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/"
      - run: node apps/native/prepare.mjs --output apps/native/gtk/resources
      - run: cargo +1.95.0 fmt --manifest-path apps/native/gtk/Cargo.toml --all -- --check
      - run: cargo +1.95.0 clippy --manifest-path apps/native/gtk/Cargo.toml --locked --all-targets -- -D warnings
      - name: Render Preferences headlessly in both appearances
        run: |
          cargo +1.95.0 build --manifest-path apps/native/gtk/Cargo.toml --locked
          for appearance in light dark; do
            GSK_RENDERER=cairo xvfb-run -a apps/native/gtk/target/debug/captures-gtk \
              --appearance "$appearance" --settings-file "$RUNNER_TEMP/settings.json" \
              --size 880x660 --screenshot "$RUNNER_TEMP/preferences-$appearance.png"
            test -s "$RUNNER_TEMP/preferences-$appearance.png"
          done
      - name: Render History with 1000 entries headlessly in both appearances
        run: |
          python3 apps/native/history_fixture.py "$RUNNER_TEMP/history" --count 1000
          for appearance in light dark; do
            GSK_RENDERER=cairo xvfb-run -a apps/native/gtk/target/debug/captures-gtk \
              --scene history --history-root "$RUNNER_TEMP/history" \
              --appearance "$appearance" --settings-file "$RUNNER_TEMP/settings.json" \
              --size 1020x720 --screenshot "$RUNNER_TEMP/history-$appearance.png"
            test -s "$RUNNER_TEMP/history-$appearance.png"
          done
      - name: Render the screenshot editor headlessly in both appearances
        run: |
          python3 apps/native/history_fixture.py "$RUNNER_TEMP/editor-history" --count 1
          artifact="$(ls "$RUNNER_TEMP/editor-history")"
          for appearance in light dark; do
            GSK_RENDERER=cairo xvfb-run -a apps/native/gtk/target/debug/captures-gtk \
              --scene editor --artifact "$artifact" --history-root "$RUNNER_TEMP/editor-history" \
              --appearance "$appearance" --settings-file "$RUNNER_TEMP/settings.json" \
              --size 1100x760 --screenshot "$RUNNER_TEMP/editor-$appearance.png"
            test -s "$RUNNER_TEMP/editor-$appearance.png"
          done
      - name: Render the floating previews headlessly in both appearances
        run: |
          for appearance in light dark; do
            GSK_RENDERER=cairo xvfb-run -a apps/native/gtk/target/debug/captures-gtk \
              --scene preview --history-root "$RUNNER_TEMP/history" \
              --appearance "$appearance" --settings-file "$RUNNER_TEMP/settings.json" \
              --screenshot "$RUNNER_TEMP/preview-$appearance.png"
            test -s "$RUNNER_TEMP/preview-$appearance.png"
          done
      # The recording editor decodes a real fixture video with the system FFmpeg.
      - name: Render the recording editor headlessly in both appearances
        run: |
          artifact="$(python3 apps/native/history_fixture.py "$RUNNER_TEMP/recording-history" --video)"
          for appearance in light dark; do
            GSK_RENDERER=cairo xvfb-run -a apps/native/gtk/target/debug/captures-gtk \
              --scene recording --artifact "$artifact" --history-root "$RUNNER_TEMP/recording-history" \
              --appearance "$appearance" --settings-file "$RUNNER_TEMP/settings.json" \
              --size 1100x760 --screenshot "$RUNNER_TEMP/recording-$appearance.png"
            test -s "$RUNNER_TEMP/recording-$appearance.png"
          done
      - name: AT-SPI smoke (History, Preferences, editors, previews)
        timeout-minutes: 5
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 apps/native/gtk/smoke.py --binary apps/native/gtk/target/debug/captures-gtk

  # The Windows host that replaces the egui/wgpu UI on Windows (see
  # docs/native-rewrite.md): rustfmt, clippy, and an offscreen Preferences render.
  native-windows:
    name: Native Windows checks
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/windows
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: node apps/native/prepare.mjs --output apps/native/windows/resources
      - run: cargo +1.95.0 fmt --manifest-path apps/native/windows/Cargo.toml --all -- --check
      - run: cargo +1.95.0 clippy --manifest-path apps/native/windows/Cargo.toml --locked --all-targets -- -D warnings
      - name: Render Preferences offscreen in both appearances
        run: |
          cargo +1.95.0 build --manifest-path apps/native/windows/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $settings = Join-Path $env:RUNNER_TEMP 'settings.json'
          foreach ($appearance in 'light', 'dark') {
            $png = Join-Path $env:RUNNER_TEMP "preferences-$appearance.png"
            & apps/native/windows/target/debug/captures-windows.exe `
              --appearance $appearance --settings-file $settings `
              --size 880x660 --screenshot $png
            if ($LASTEXITCODE -ne 0) { throw "--screenshot ($appearance) exited $LASTEXITCODE" }
            if (-not (Test-Path $png) -or (Get-Item $png).Length -eq 0) { throw "$png is empty" }
          }
      - name: Render History offscreen in both appearances
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'history'
          python apps/native/history_fixture.py $root --count 24
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $settings = Join-Path $env:RUNNER_TEMP 'settings.json'
          foreach ($appearance in 'light', 'dark') {
            $png = Join-Path $env:RUNNER_TEMP "history-$appearance.png"
            & apps/native/windows/target/debug/captures-windows.exe `
              --scene history --history-root $root `
              --appearance $appearance --settings-file $settings `
              --size 1020x720 --screenshot $png
            if ($LASTEXITCODE -ne 0) { throw "--screenshot history ($appearance) exited $LASTEXITCODE" }
            if (-not (Test-Path $png) -or (Get-Item $png).Length -eq 0) { throw "$png is empty" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-preferences
          path: |
            ${{ runner.temp }}/preferences-*.png
            ${{ runner.temp }}/history-*.png
          if-no-files-found: error

  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      # The Azure apt mirror sometimes trickles: downloads run separately so
      # each retry resumes partial files, later attempts switch to
      # archive.ubuntu.com, and the .debs are cached between runs.
      - name: Restore cached apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: rust-checks-apt-ubuntu-24.04-v1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          packages="
            build-essential curl file ffmpeg hsetroot
            libayatana-appindicator3-dev libasound2-dev libclang-dev libdbus-1-dev
            libegl-dev libgbm-dev libpipewire-0.3-dev libspa-0.2-dev librsvg2-dev libssl-dev
            libwayland-dev libwebkit2gtk-4.1-dev libxcb1-dev libxdo-dev libxrandr-dev
            pkg-config wget xauth xvfb"
          if compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/
          fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          downloaded=
          for attempt in 1 2 3 4; do
            if [ "$attempt" -ge 3 ]; then
              echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            if timeout 180 sudo apt-get $apt_opts update &&
               timeout 240 sudo apt-get $apt_opts install -y --download-only $packages; then
              downloaded=1
              break
            fi
            echo "apt download attempt $attempt failed; retrying"
            sleep 10
          done
          test -n "$downloaded"
          sudo apt-get install -y --no-download $packages
          mkdir -p "$HOME/apt-archives"
          cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/"
      # This job id, toolchain and command set match the `rust` job in
      # release.yml, so both share one rust-cache key per OS. That main-branch
      # run seeds the cache; PR runs restore it but never save a per-PR copy
      # (dependencies only, keyed by Cargo.lock), which kept evicting the
      # main-branch caches from the repository's cache quota.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - name: Preserve native restart sessions through the pinned NSIS handoff
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-update-session.ps1
      - name: Decode recorded colors with an independent player
        if: runner.os == 'Linux'
        run: cargo test -p captures-video decoded_colors_match_rgb_input -- --ignored
      - name: Record, pause, publish, and recover on a private X11 display
        if: runner.os == 'Linux'
        run: >-
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 CAPTURES_TEST_PRIVATE_X11=1
          xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp -noreset'
          cargo test -p captures-recording-platform
          private_x11_records_pause_resume_pixels_and_cancelled_start -- --ignored
      - name: Return Escape to other X11 applications after capture
        if: runner.os == 'Linux'
        run: >-
          env -u WAYLAND_DISPLAY CAPTURES_TEST_PRIVATE_X11=1 xvfb-run -a
          cargo test -p captures-app --test escape_hotkey -- --ignored
      - run: cargo clippy --workspace --all-targets -- -D warnings

  macos-app:
    name: macOS app bundle
    # About 13 minutes; nightly and manual only.
    if: github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - run: npm ci
      - uses: ./.github/actions/prepare-media
      - run: node scripts/native-preview-build.mjs build aarch64-apple-darwin 2026.10.1101 --unsigned
      - name: Validate bundled media sidecars and notices
        shell: bash
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Captures.app"
          ffmpeg="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffmpeg*' -print -quit)"
          ffprobe="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffprobe*' -print -quit)"
          test -n "$ffmpeg"
          test -n "$ffprobe"
          test -f "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
          test -f "$app/Contents/Resources/notices/ffmpeg/COPYING.LGPLv2.1"
          test -f "$app/Contents/Resources/notices/ffmpeg/NOTICE.md"
          test -f "$app/Contents/Resources/notices/openh264/LICENSE"
          test -f "$app/Contents/Resources/notices/openh264/NOTICE.md"
          node scripts/validate-ffmpeg-sidecars.mjs \
            "$ffmpeg" \
            "$ffprobe" \
            "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: captures-macos-app
          path: target/aarch64-apple-darwin/release/bundle/macos/Captures.app

  cross-platform-app:
    name: Desktop app (${{ matrix.platform }})
    # 10-20 minutes; nightly and manual only.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2025
            bundle: nsis
            target: x86_64-pc-windows-msvc
            artifact_name: captures-windows-installer
            artifact_path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - platform: Ubuntu
            os: ubuntu-24.04
            bundle: deb
            target: x86_64-unknown-linux-gnu
            artifact_name: captures-ubuntu-package
            artifact_path: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v4
      # The Azure apt mirror sometimes trickles: downloads run separately so
      # each retry resumes partial files, later attempts switch to
      # archive.ubuntu.com, and the .debs are cached between runs.
      - name: Restore cached apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: desktop-package-apt-ubuntu-24.04-v1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          packages="
            build-essential curl file libayatana-appindicator3-dev libasound2-dev
            libclang-dev libdbus-1-dev libegl-dev libgbm-dev libpipewire-0.3-dev
            libspa-0.2-dev librsvg2-dev libssl-dev libwayland-dev libwebkit2gtk-4.1-dev
            libxcb1-dev libxdo-dev libxrandr-dev nasm patchelf xdg-utils pkg-config wget
            xz-utils yasm zlib1g-dev"
          if compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/
          fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          downloaded=
          for attempt in 1 2 3 4; do
            if [ "$attempt" -ge 3 ]; then
              echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            if timeout 180 sudo apt-get $apt_opts update &&
               timeout 240 sudo apt-get $apt_opts install -y --download-only $packages; then
              downloaded=1
              break
            fi
            echo "apt download attempt $attempt failed; retrying"
            sleep 10
          done
          test -n "$downloaded"
          sudo apt-get install -y --no-download $packages
          mkdir -p "$HOME/apt-archives"
          cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            base-devel
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-zlib
      - run: npm ci
      - uses: ./.github/actions/prepare-media
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build native Preview installers without release credentials
        run: node scripts/native-preview-build.mjs build "${{ matrix.target }}" 2026.10.1101 --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
