name: Self-hosted Mac fallback

# If a job has waited more than an hour for a self-hosted machine (the Mac or the
# Windows PC) and no runner with its label is working through jobs (asleep,
# closed, off, or online but stuck idle), cancel its run and re-run it. Re-runs
# always go to GitHub-hosted runners (see mac-route.yml). Jobs only waiting their
# turn behind a busy runner keep waiting: that hardware is the point. A run that a newer run of the same workflow on the
# same branch already supersedes is only cancelled, so the re-run can never
# displace newer work in a concurrency group.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: mac-runner-fallback
  cancel-in-progress: false

jobs:
  fallback:
    name: Move jobs stuck on offline or idle self-hosted machines to GitHub-hosted runners
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_TOKEN: ${{ secrets.MAC_RUNNER_STATUS_TOKEN }}
          REPO: ${{ github.repository }}
          MAX_WAIT_MINUTES: '60'
        run: |
          set -euo pipefail
          export CUTOFF=$(( $(date +%s) - MAX_WAIT_MINUTES * 60 ))
          # Labels of this repository's self-hosted runners that are online and
          # running a job. A job queued an hour behind one of them is just
          # waiting its turn; an idle online runner with an hour-old job queued
          # for it is stuck. Without the token (or on an API error) none count,
          # so every long wait falls back, as before.
          working=""
          if [[ -n "${RUNNER_TOKEN:-}" ]]; then
            working="$(GH_TOKEN="$RUNNER_TOKEN" gh api "repos/$REPO/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.status == "online" and .busy) | .labels[].name] | unique | join(" ")' 2>/dev/null)" || working=""
          fi
          export WORKING=" $working "
          echo "Labels with a busy self-hosted runner:${WORKING}"
          for status in queued in_progress; do
            gh api "repos/$REPO/actions/runs?status=$status&per_page=100" \
              --jq '.workflow_runs[] | select(.run_attempt == 1) | "\(.id) \(.workflow_id) \(.head_branch)"'
          done | sort -u | while read -r run workflow branch; do
            stuck="$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" --jq '
              [.jobs[] | select(.status == "queued")
                       | select(any(.labels[]; startswith("josemac") or startswith("josewin") or startswith("joselinux")))
                       | select((.created_at | fromdateiso8601) < ($ENV.CUTOFF | tonumber))
                       | select(any(.labels[]; . as $label | ($label | startswith("jose")) and ($ENV.WORKING | contains(" " + $label + " ") | not)))] | length')"
            (( stuck > 0 )) || continue
            echo "Run $run has $stuck job(s) waiting over ${MAX_WAIT_MINUTES}m with no busy self-hosted runner for them; cancelling."
            gh api -X POST "repos/$REPO/actions/runs/$run/cancel" >/dev/null || continue
            for _ in $(seq 36); do
              [[ "$(gh api "repos/$REPO/actions/runs/$run" --jq .status)" == completed ]] && break
              sleep 5
            done
            # Only a newer run (higher ID) supersedes this one. The first listed
            # run is not reliable: the list can briefly omit a just-cancelled run.
            latest="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=$branch&per_page=20" \
              --jq "[.workflow_runs[].id | select(. > $run)] | max // empty")"
            if [[ -n "$latest" ]]; then
              echo "Run $run is superseded by run $latest; not re-running."
              continue
            fi
            gh api -X POST "repos/$REPO/actions/runs/$run/rerun" >/dev/null \
              && echo "Re-running run $run on GitHub-hosted runners." \
              || echo "::warning::Could not re-run run $run"
          done
