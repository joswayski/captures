# Generated by joswayski/automation scripts/listener.mjs. No failing-run checkout.
name: Amp CI repair

on:
  workflow_run:
    workflows:
      - "CI"
      - "Captures Preview"
      - "Native macOS workbench"
      - "Native wgpu workbench"
      - "AWS image"
      - "AWS API image"
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

# Serialize durable reservations; retain up to 100 pending completion events.
concurrency:
  group: amp-ci-repair
  queue: max

jobs:
  repair:
    if: >-
      vars.AMP_REPAIR_ENABLED == 'true' &&
      github.repository == 'joswayski/captures' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["failure","cancelled","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Investigate failure with Amp
        uses: joswayski/automation@1c406dd33e53f33798a9d85b4742649739534738
        with:
          enabled: ${{ vars.AMP_REPAIR_ENABLED }}
          dry-run: ${{ vars.AMP_REPAIR_DRY_RUN == 'true' }}
          daily-limit: ${{ vars.AMP_REPAIR_DAILY_LIMIT || '3' }}
          github-token: ${{ github.token }}
          amp-api-key: ${{ secrets.AMP_API_KEY }}
