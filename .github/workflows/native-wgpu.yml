name: Native wgpu workbench

# Runs on main only; pull requests get no CI. Use "Run workflow" to test a branch.
on:
  push:
    branches: [main]
    paths:
      - 'apps/native/**'
      - 'crates/captures-settings*/**'
      - 'crates/captures-app/**'
      - 'crates/captures-feedback/**'
      - 'crates/captures-history/**'
      - 'crates/captures-image/**'
      - 'crates/captures-capture/**'
      - 'crates/captures-session/**'
      - 'crates/captures-recording*/**'
      - 'crates/captures-media/**'
      - 'Cargo.lock'
      - 'shared/**'
      - 'scripts/native-tokens.test.mjs'
      - 'apps/desktop/ui/src/lib/thumbnailExit.ts'
      - 'apps/desktop/assets/icon.svg'
      - '.github/workflows/native-wgpu.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# The running build always finishes and only the newest waiting push runs next
# (GitHub replaces older pending runs in the group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Unit tests, lints and the Wayland drag probe. The release builds below run
  # in parallel so the Linux GUI smokes no longer wait for the Windows leg.
  workbench:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/wgpu
      - name: Install Linux windowing and software-rendering test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxi-dev libxrandr-dev libdbus-1-dev libxcb1-dev libpipewire-0.3-dev libasound2-dev libasound2-plugins pulseaudio libegl-dev libgbm-dev libclang-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb dbus python3-dbus python3-gi python3-xlib openbox picom hsetroot sway wl-clipboard xclip xdotool x11-utils x11-apps imagemagick xfce4-panel xdg-utils ffmpeg
      - run: node apps/native/prepare.mjs --output apps/native/wgpu/resources
      - run: node --test scripts/native-tokens.test.mjs
      - run: python -m unittest discover -s apps/native -p 'test_*.py'
      - run: cargo +1.95.0 fmt --manifest-path apps/native/wgpu/Cargo.toml --all -- --check
      - run: cargo +1.95.0 test --manifest-path apps/native/wgpu/Cargo.toml --locked
      - run: cargo +1.95.0 clippy --manifest-path apps/native/wgpu/Cargo.toml --locked --all-targets -- -D warnings
      - name: Verify signed development updates and isolated profile import
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          cargo +1.95.0 test --locked --target-dir apps/native/wgpu/target -p captures-app --lib updater::
          cargo +1.95.0 test --locked --target-dir apps/native/wgpu/target -p captures-app --bin native_update_helper
          cargo +1.95.0 test --locked --target-dir apps/native/wgpu/target -p captures-app --lib profile_import::
          cargo +1.95.0 test --locked --target-dir apps/native/wgpu/target -p captures-app --bin native_profile_import
      - name: Acquire exact Wayland pixels through the desktop screenshot portal
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y swaybg pipewire xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-wlr grim
          cargo +1.95.0 build --manifest-path apps/native/wgpu/Cargo.toml --locked --bin wayland_screenshot_probe
          /usr/bin/python3 apps/native/wayland_screenshot_smoke.py --binary apps/native/wgpu/target/debug/wayland_screenshot_probe
      - name: Acquire changing Wayland video through a portal-granted PipeWire remote
        if: runner.os == 'Linux'
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          sudo apt-get install -y meson ninja-build libinih-dev libdrm-dev libsystemd-dev wayland-protocols wireplumber python3-gi-cairo gir1.2-gtk-3.0
          backend="$(apps/native/build_wayland_portal_fixture.sh "$RUNNER_TEMP/wayland-portal-fixture")"
          cargo +1.95.0 test --locked --target-dir apps/native/wgpu/target -p captures-recording -p captures-recording-xcap -p captures-recording-platform --lib
          cargo +1.95.0 build --manifest-path apps/native/wgpu/Cargo.toml --locked --bin wayland_video_probe --bin wayland_recording_probe
          /usr/bin/python3 apps/native/wayland_video_smoke.py --binary apps/native/wgpu/target/debug/wayland_video_probe --recording-binary apps/native/wgpu/target/debug/wayland_recording_probe --wlr-backend "$backend"
      - name: Transfer original files to an independent Wayland client
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gir1.2-gtk-3.0
          python apps/native/wayland_drag_smoke.py
      - name: Unmap native windows and capture clean Wayland portal screenshots
        if: runner.os == 'Linux'
        run: |
          cargo +1.95.0 build --manifest-path apps/native/wgpu/Cargo.toml --locked --bin captures-wgpu-workbench
          python apps/native/wayland_visibility_smoke.py
          /usr/bin/python3 apps/native/wayland_native_capture_smoke.py --binary apps/native/wgpu/target/debug/captures-wgpu-workbench --injector apps/native/wayland_drag_probe/target/debug/captures-wayland-drag-probe --screenshots native-wayland-capture
      - name: Exercise Wayland resident startup, child windows and real tray recovery
        if: runner.os == 'Linux'
        run: /usr/bin/python3 apps/native/wayland_lifecycle_smoke.py --binary apps/native/wgpu/target/debug/captures-wgpu-workbench --injector apps/native/wayland_drag_probe/target/debug/captures-wayland-drag-probe
      - name: Record from Wayland History and retain interrupted takes
        if: runner.os == 'Linux'
        run: |
          backend="$(apps/native/build_wayland_portal_fixture.sh "$RUNNER_TEMP/wayland-portal-fixture")"
          /usr/bin/python3 apps/native/wayland_recording_host_smoke.py --binary apps/native/wgpu/target/debug/captures-wgpu-workbench --injector apps/native/wayland_drag_probe/target/debug/captures-wayland-drag-probe --wlr-backend "$backend" --output "$RUNNER_TEMP/native-wayland-recording"
      - name: Hold native preview positions through overlapping dust exits
        if: runner.os == 'Linux'
        run: /usr/bin/python3 apps/native/x11_preview_smoke.py --retarget-only --binary apps/native/wgpu/target/debug/captures-wgpu-workbench --output "$RUNNER_TEMP/native-preview-retarget"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: native-wgpu-workbench-evidence-${{ matrix.os }}
          path: |
            native-wayland-capture
            ${{ runner.temp }}/native-wayland-recording
            ${{ runner.temp }}/native-preview-retarget
          if-no-files-found: ignore
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  windows-release:
    name: release (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/wgpu
      - run: node apps/native/prepare.mjs --output apps/native/wgpu/resources
      - run: cargo +1.95.0 build --manifest-path apps/native/wgpu/Cargo.toml --locked --release
      - name: Exercise native Windows windows
        run: python apps/native/wgpu/smoke.py --binary apps/native/wgpu/target/release/captures-wgpu-workbench.exe --output native-smoke
      - name: Forward native media between Windows processes
        run: python apps/native/instance_smoke.py --trace --binary apps/native/wgpu/target/release/captures-wgpu-workbench.exe --output native-smoke/instance
      - name: Exercise staged Windows Open With arguments
        run: |
          python apps/native/package.py --platform windows --binary apps/native/wgpu/target/release/captures-wgpu-workbench.exe --output native-package
          python apps/native/instance_smoke.py --binary native-package/CapturesNative.exe --output native-smoke/open-with --positional
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-wgpu-evidence-windows-2025
          path: native-smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: native-wgpu-binary-windows-2025
          path: |
            apps/native/wgpu/target/release/captures-wgpu-workbench
            apps/native/wgpu/target/release/captures-wgpu-workbench.exe
            apps/native/wgpu/target/release/wayland_clipboard_probe
          if-no-files-found: error
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  linux-release:
    name: release (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/wgpu
      - name: Install Linux windowing and software-rendering test dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxi-dev libxrandr-dev libdbus-1-dev libxcb1-dev libpipewire-0.3-dev libasound2-dev libasound2-plugins pulseaudio libegl-dev libgbm-dev libclang-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb dbus python3-dbus python3-gi python3-xlib openbox picom hsetroot sway wl-clipboard xclip xdotool x11-utils x11-apps imagemagick xfce4-panel xdg-utils ffmpeg
      - run: node apps/native/prepare.mjs --output apps/native/wgpu/resources
      - run: cargo +1.95.0 build --manifest-path apps/native/wgpu/Cargo.toml --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: native-wgpu-binary-ubuntu-24.04
          path: |
            apps/native/wgpu/target/release/captures-wgpu-workbench
            apps/native/wgpu/target/release/captures-wgpu-workbench.exe
            apps/native/wgpu/target/release/wayland_clipboard_probe
          if-no-files-found: error
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  windows-development-package:
    needs: [windows-release, workbench]
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            base-devel diffutils make mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm mingw-w64-ucrt-x86_64-zlib
      - uses: actions/download-artifact@v4
        with:
          name: native-wgpu-binary-windows-2025
          path: native-build
      - uses: ./.github/actions/prepare-media
      - name: Stage the isolated native test app with pinned media tools
        run: |
          python apps/native/package.py --platform windows --binary native-build/captures-wgpu-workbench.exe --media-target x86_64-pc-windows-msvc --output native-package --archive native-development-windows-x64.zip
          Expand-Archive native-development-windows-x64.zip native-unpacked
          & "native-unpacked/native-package/CapturesNative.exe" --font-license
      - uses: actions/upload-artifact@v4
        with:
          name: native-development-windows-${{ runner.arch }}
          path: native-development-windows-x64.zip
          if-no-files-found: error
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  linux-development-package:
    needs: [linux-release, workbench]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - name: Install media build and native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm yasm zlib1g-dev libpipewire-0.3-0 libasound2t64 libdbus-1-3 libgbm1 libxcb1 libxkbcommon0 libx11-6
      - uses: actions/download-artifact@v4
        with:
          name: native-wgpu-binary-ubuntu-24.04
          path: native-build
      - uses: ./.github/actions/prepare-media
      - name: Stage the isolated native test app with pinned media tools
        run: |
          python apps/native/package.py --platform linux --binary native-build/captures-wgpu-workbench --media-target x86_64-unknown-linux-gnu --output native-package --archive native-development-linux-x64.tar.gz
          mkdir native-unpacked
          tar -xzf native-development-linux-x64.tar.gz -C native-unpacked
          native-unpacked/native-package/captures-native --font-license
      - uses: actions/upload-artifact@v4
        with:
          name: native-development-linux-${{ runner.arch }}
          path: native-development-linux-x64.tar.gz
          if-no-files-found: error
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  linux-smoke:
    needs: linux-release
    runs-on: ubuntu-24.04
    # Build once, then isolate long-running GUI suites on separate runners.
    # Keep smoke assertions/deadlines unchanged and exercise both appearances.
    # Each suite is split into two shards of roughly equal duration; every
    # step runs in exactly one shard, in its original order.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: capture
            appearance: both
            shard: 1
          - suite: capture
            appearance: both
            shard: 2
          - suite: recording
            appearance: dark
            shard: 1
          - suite: recording
            appearance: dark
            shard: 2
          - suite: recording
            appearance: light
            shard: 1
          - suite: recording
            appearance: light
            shard: 2
          - suite: screenshot
            appearance: dark
            shard: 1
          - suite: screenshot
            appearance: dark
            shard: 2
          - suite: screenshot
            appearance: light
            shard: 1
          - suite: screenshot
            appearance: light
            shard: 2
    env:
      APPEARANCE: ${{ matrix.appearance }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux windowing and software-rendering test dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxi-dev libxrandr-dev libdbus-1-dev libxcb1-dev libpipewire-0.3-dev libasound2-dev libasound2-plugins pulseaudio libegl-dev libgbm-dev libclang-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb dbus python3-dbus python3-gi python3-xlib openbox picom hsetroot sway wl-clipboard xclip xdotool x11-utils x11-apps imagemagick xfce4-panel xdg-utils ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: native-wgpu-binary-ubuntu-24.04
          path: apps/native/wgpu/target/release
      - name: Restore executable permissions lost in artifact transfer
        run: chmod +x apps/native/wgpu/target/release/captures-wgpu-workbench apps/native/wgpu/target/release/wayland_clipboard_probe
      - name: Exercise native Wayland image clipboard transport
        if: matrix.suite == 'capture' && matrix.shard == 1
        run: python apps/native/wayland_clipboard_smoke.py --binary apps/native/wgpu/target/release/wayland_clipboard_probe
      - name: Exercise native Linux windows (X11, software Vulkan)
        if: matrix.suite == 'capture' && matrix.shard == 1
        run: xvfb-run -a python apps/native/wgpu/smoke.py --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-smoke
      - name: Exercise native first-run gating and queued media on private X11
        if: matrix.suite == 'capture' && matrix.shard == 1
        run: /usr/bin/python3 apps/native/x11_onboarding_smoke.py --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-onboarding
      - name: Render and drive the stub-backed update notice on private X11
        if: matrix.suite == 'capture' && matrix.shard == 1
        run: python apps/native/x11_update_notice_smoke.py --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-update-notice
      - name: Transfer preview files and recover cancelled drags on private X11
        if: matrix.suite == 'capture' && matrix.shard == 1
        run: |
          /usr/bin/python3 apps/native/x11_preview_smoke.py --drag-only --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-drag
          /usr/bin/python3 apps/native/x11_preview_smoke.py --drag-only --reduced-motion --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-drag-reduced
      - name: Capture real region and window pixels on private X11 (simulated session state)
        if: matrix.suite == 'capture' && matrix.shard == 1
        # Distro dbus/gi bindings belong to system Python, not setup-python.
        run: /usr/bin/python3 apps/native/x11_capture_smoke.py --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-capture
      - name: Exercise unified New Capture targets and toolbar on private X11
        if: matrix.suite == 'capture' && matrix.shard == 1
        run: /usr/bin/python3 apps/native/x11_capture_smoke.py --controls --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-controls
      - name: Exercise registered target keys inside New Capture on private X11
        if: matrix.suite == 'capture' && matrix.shard == 1
        run: /usr/bin/python3 apps/native/x11_capture_smoke.py --controls --target-shortcuts --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-target-shortcuts
      - name: Recapture an open selector and report a busy capture on private X11
        if: matrix.suite == 'capture' && matrix.shard == 1
        run: /usr/bin/python3 apps/native/x11_capture_smoke.py --recapture --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-recapture
      - name: Show the capture failure dialog and recover from the display shortcut on private X11
        if: matrix.suite == 'capture' && matrix.shard == 1
        run: /usr/bin/python3 apps/native/x11_capture_smoke.py --failure-dialog --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-failure-dialog
      - name: Record and decode real MP4 with native controls on private X11
        if: matrix.suite == 'capture' && matrix.shard == 2
        run: /usr/bin/python3 apps/native/x11_recording_smoke.py --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-recording
      - name: Exercise live microphone levels and decoded mute intervals on private X11
        if: matrix.suite == 'capture' && matrix.shard == 2
        run: |
          for appearance in dark light; do
            /usr/bin/python3 apps/native/x11_recording_smoke.py --restart-only --virtual-microphone --appearance "$appearance" --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output "native-x11-microphone-$appearance"
          done
      - name: Exercise default and unavailable explicit microphones at segment reopen
        if: matrix.suite == 'capture' && matrix.shard == 2
        run: |
          for device in default explicit; do
            /usr/bin/python3 apps/native/x11_recording_smoke.py --device-change "$device" --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output "native-x11-device-$device"
          done
      - name: Exercise the failed-start HUD, Retry recording and Delete on private X11
        if: matrix.suite == 'capture' && matrix.shard == 2
        run: /usr/bin/python3 apps/native/x11_recording_smoke.py --start-failure --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-start-failure
      - name: Capture regions while a native recording continues on private X11
        if: matrix.suite == 'capture' && matrix.shard == 2
        run: /usr/bin/python3 apps/native/x11_recording_smoke.py --screenshot-only --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-recording-screenshot
      - name: Take Screenshot Display from the shortcut and tray beside a native recording on private X11
        if: matrix.suite == 'capture' && matrix.shard == 2
        run: /usr/bin/python3 apps/native/x11_recording_smoke.py --display-screenshot-only --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output native-x11-recording-display-screenshot
      - name: Open external GIF MP4 WebM and images without replacing sources on private X11
        if: matrix.suite == 'recording' && matrix.shard == 1
        run: /usr/bin/python3 apps/native/x11_recording_editor_smoke.py --external-media --appearance "$APPEARANCE" --binary apps/native/wgpu/target/release/captures-wgpu-workbench --output "native-x11-external-media-$APPEARANCE"
      - name: Exercise recording editor frames, resolution, audio, estimates and exports on private X11
