name: Deploy production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Optional full main SHA to deploy; defaults to current main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Captures
    if: github.repository == 'joswayski/captures' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: "395451633568"
      AWS_REGION: us-east-1
      ECR_REGISTRY: 395451633568.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: production/captures
      DEPLOY_ROLE_ARN: arn:aws:iam::395451633568:role/production-captures-deployer
      SSM_DOCUMENT: production-captures-deploy
    steps:
      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: captures-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve immutable image
        id: image
        env:
          TARGET_GIT_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail

          target_sha="${TARGET_GIT_SHA:-$GITHUB_SHA}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "git_sha must be a full lowercase 40-character Git SHA." >&2
            exit 1
          }

          if ! image_json="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$target_sha" \
            --output json)"; then
            echo "No published Captures image exists for $target_sha yet." >&2
            exit 1
          fi

          digest="$(jq -r '.imageDetails[0].imageDigest // empty' <<<"$image_json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "ECR returned an invalid image digest for $target_sha." >&2
            exit 1
          }

          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${target_sha}@${digest}"
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Locate the production k3s node
        id: host
        run: |
          set -euo pipefail

          instances_json="$(aws ec2 describe-instances \
            --filters \
              Name=tag:Name,Values=production-k3s-server \
              Name=tag:role,Values=k3s-server \
              Name=instance-state-name,Values=running \
            --output json)"
          instance_count="$(jq '[.Reservations[].Instances[]] | length' \
            <<<"$instances_json")"
          [[ "$instance_count" == "1" ]] || {
            echo "Expected exactly one running production k3s node; found $instance_count." >&2
            exit 1
          }
          instance_id="$(jq -r '.Reservations[0].Instances[0].InstanceId' \
            <<<"$instances_json")"
          [[ "$instance_id" =~ ^i-[0-9a-f]+$ ]]
          printf 'instance_id=%s\n' "$instance_id" >> "$GITHUB_OUTPUT"

      - name: Deploy and wait for rollout
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
          TARGET_SHA: ${{ steps.image.outputs.target_sha }}
        run: |
          set -euo pipefail

          command_id="$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "Image=$IMAGE" \
            --comment "Captures $TARGET_SHA from GitHub run $GITHUB_RUN_ID" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)"
          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]]

          invocation=""
          status=""
          for _ in {1..120}; do
            invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || true)"
            if [[ -n "$invocation" ]]; then
              status="$(jq -r '.Status // empty' <<<"$invocation")"
              case "$status" in
                Success|Cancelled|TimedOut|Failed) break ;;
                Pending|InProgress|Delayed|Cancelling) ;;
                *) echo "Unexpected SSM command status: ${status:-empty}" >&2; break ;;
              esac
            fi
            sleep 5
          done

          stdout=""
          stderr=""
          if [[ -n "$invocation" ]]; then
            stdout="$(jq -r '.StandardOutputContent // empty' <<<"$invocation")"
            stderr="$(jq -r '.StandardErrorContent // empty' <<<"$invocation")"
          fi
          [[ -z "$stdout" ]] || printf '%s\n' "$stdout"
          [[ -z "$stderr" ]] || printf '%s\n' "$stderr" >&2
          [[ "$status" == "Success" ]] || {
            echo "Production deployment did not succeed (status: ${status:-unknown})." >&2
            exit 1
          }

          printf '### Captures production deployment\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Image: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- SSM command: `%s`\n' "$command_id" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Rollout: succeeded\n' >> "$GITHUB_STEP_SUMMARY"
