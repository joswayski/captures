name: Prepare cached media sidecars
description: Restore or build pinned unsigned FFmpeg binaries, then validate before caching.
inputs:
  store-release-id:
    description: >-
      Draft release from `scripts/media-sidecar-store.mjs ensure`. When set, a
      build GitHub evicted from the Actions cache is restored from that release,
      and new builds are stored there too. Needs `contents: write`.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Fingerprint the native media toolchain
      id: toolchain
      shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import { createHash } from 'node:crypto';
        import { execFileSync } from 'node:child_process';
        import { appendFileSync } from 'node:fs';
        const compiler = process.platform === 'win32' ? 'gcc' : 'cc';
        const fingerprint = [
          process.env.ImageOS,
          process.env.ImageVersion,
          execFileSync(compiler, ['--version'], { encoding: 'utf8' }),
          execFileSync('rustc', ['-vV'], { encoding: 'utf8' }),
          process.platform === 'darwin'
            ? execFileSync('xcrun', ['--show-sdk-version'], { encoding: 'utf8' })
            : execFileSync('pkg-config', ['--modversion', 'zlib'], { encoding: 'utf8' }),
        ].join('\n');
        appendFileSync(process.env.GITHUB_OUTPUT, `digest=${createHash('sha256').update(fingerprint).digest('hex')}\n`);
        NODE
    - name: Restore unsigned media cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        key: ffmpeg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('scripts/build-ffmpeg-sidecars.sh', 'scripts/validate-ffmpeg-sidecars.mjs', 'apps/native/bundle/ffmpeg/BUILD_CONFIG.txt', 'apps/native/bundle/ffmpeg/NOTICE.md', 'rust-toolchain.toml') }}
        path: |
          apps/native/bundle/binaries/ffmpeg-*
          apps/native/bundle/binaries/ffprobe-*
          apps/native/bundle/ffmpeg/COPYING.LGPLv2.1
          target/ffmpeg-build/*.tar.xz
          target/ffmpeg-build/*.tar.xz.asc
          target/ffmpeg-dist
    # GitHub evicts the least recently used caches above 10 GB, which is always
    # this one for release packaging. Historical package jobs overlay the store
    # script from the workflow commit, like the downloader below.
    - name: Restore from the release store after a cache eviction
      if: inputs.store-release-id != '' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STORE_RELEASE_ID: ${{ inputs.store-release-id }}
        KEY: ${{ steps.cache.outputs.cache-primary-key }}
      run: |
        set -euo pipefail
        store=scripts/media-sidecar-store.mjs
        if [[ -f "release-tools/$store" ]]; then store="release-tools/$store"; fi
        node "$store" restore "$STORE_RELEASE_ID" "$KEY"
    # Always runs: download verifies the pinned checksum even on a cache hit.
    # Historical package jobs overlay this helper from the workflow commit.
    - name: Download pinned FFmpeg source
      shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ -f release-tools/scripts/download-ffmpeg-source.mjs ]]; then
          node release-tools/scripts/download-ffmpeg-source.mjs
        else
          node scripts/download-ffmpeg-source.mjs
        fi
    # Always runs: the script verifies the source checksum, recreates notices,
    # and exercises both binaries even when compilation can be skipped.
    - name: Build or validate media sidecars
      shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: bash scripts/build-ffmpeg-sidecars.sh
    # Save now, not as a post-job hook: packaging may sign the binaries later.
    - name: Save validated unsigned media cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.cache.outputs.cache-primary-key }}
        path: |
          apps/native/bundle/binaries/ffmpeg-*
          apps/native/bundle/binaries/ffprobe-*
          apps/native/bundle/ffmpeg/COPYING.LGPLv2.1
          target/ffmpeg-build/*.tar.xz
          target/ffmpeg-build/*.tar.xz.asc
          target/ffmpeg-dist
    - name: Keep a copy that cache eviction cannot remove
      if: inputs.store-release-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STORE_RELEASE_ID: ${{ inputs.store-release-id }}
        KEY: ${{ steps.cache.outputs.cache-primary-key }}
      run: |
        set -euo pipefail
        store=scripts/media-sidecar-store.mjs
        if [[ -f "release-tools/$store" ]]; then store="release-tools/$store"; fi
        node "$store" save "$STORE_RELEASE_ID" "$KEY"
