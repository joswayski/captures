name: captures-cloud-local

# Share web's network namespace so the API's loopback-only development cookie
# and database safeguards stay intact. Only the website is published to the host.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--workspace", "@captures/web", "--", "--host", "0.0.0.0", "--port", "5174", "--strictPort"]
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      CAPTURES_API_ORIGIN: http://127.0.0.1:3001
      CAPTURES_MEDIA_ORIGIN: http://127.0.0.1:8787
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    init: true

  db:
    image: postgres:17-bookworm
    network_mode: service:web
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: captures
      POSTGRES_PASSWORD: captures-local-only
      POSTGRES_DB: captures_local
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U captures -d captures_local"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    network_mode: service:web
    depends_on:
      db:
        condition: service_healthy
    # Match the host user so a read-only ~/.aws mount remains readable on Linux.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /home/dev
      DATABASE_URL: postgres://captures:captures-local-only@127.0.0.1:5432/captures_local
      MIGRATION_DATABASE_URL: postgres://captures:captures-local-only@127.0.0.1:5432/captures_local
      CAPTURES_API_BIND: 127.0.0.1:3001
      AUTH_ENABLED: "true"
      SHARING_ENABLED: "true"
      AUTH_ALLOWED_ORIGIN: http://localhost:5174
      AUTH_INSECURE_LOOPBACK_COOKIE: "true"
      AUTH_TRUST_CF_CONNECTING_IP: "false"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.local}
      MEDIA_WORKER_SECRET: ${MEDIA_WORKER_SECRET:?Set MEDIA_WORKER_SECRET in .env.local}
      AWS_PROFILE: ${AWS_PROFILE:?Set your AWS SSO profile in .env.local}
      AWS_REGION: ${AWS_REGION:?Set the SES region in .env.local}
      AWS_EC2_METADATA_DISABLED: "true"
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:?Set the verified SES sender in .env.local}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:?Set the SES configuration set in .env.local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID in .env.local}
      R2_BUCKET: staging-captures
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set staging R2 credentials in .env.local}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set staging R2 credentials in .env.local}
    volumes:
      - type: bind
        source: ${HOME}/.aws
        target: /home/dev/.aws
        read_only: true
        bind:
          create_host_path: false
    init: true

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: service:web
    environment:
      CLOUDFLARE_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID in .env.local}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set a Cloudflare development API token in .env.local}
      MEDIA_WORKER_SECRET: ${MEDIA_WORKER_SECRET:?Set MEDIA_WORKER_SECRET in .env.local}
      WRANGLER_SEND_METRICS: "false"
      BROWSER: "false"
    # Only these two values enter the Worker's bindings, not the Cloudflare token.
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'MEDIA_API_ORIGIN=http://127.0.0.1:3001\nMEDIA_WORKER_SECRET=%s\n' "$$MEDIA_WORKER_SECRET" > apps/media-worker/.dev.vars
        exec npx wrangler dev --config apps/media-worker/wrangler.compose.jsonc --ip 127.0.0.1 --port 8787
    init: true

volumes:
  database:
